[package]
name = "re_integration_test"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[features]
default = []

## Enable the browser based integration tests
browser = ["dep:base64", "dep:headless_chrome", "dep:re_web_viewer_server", "dep:url"]

[dependencies]
re_build_info.workspace = true
re_log.workspace = true
re_log_encoding.workspace = true
re_protos.workspace = true
re_redap_client.workspace = true
re_sdk = { workspace = true, features = ["server"] }
re_sdk_types.workspace = true
re_server = { workspace = true, features = ["lance"] }
re_ui = { workspace = true, features = ["testing"] }
re_uri.workspace = true
re_viewer = { workspace = true, features = ["testing", "map_view"] }
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

egui_inspection.workspace = true
egui_kittest.workspace = true
egui_tiles.workspace = true
egui.workspace = true
image.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tonic = { workspace = true, features = ["transport"] }

# Only used by the browser inspection tests.
# `__external_web_viewer` keeps the web viewer wasm out of the build graph of this crate:
# the tests serve the prebuilt viewer from disk at runtime instead.
base64 = { workspace = true, optional = true }
headless_chrome = { workspace = true, optional = true }
re_web_viewer_server = { workspace = true, optional = true, features = ["__external_web_viewer"] }
url = { workspace = true, optional = true }

[dev-dependencies]
re_dataframe_ui.workspace = true
re_datafusion.workspace = true
re_entity_db.workspace = true
re_log_channel.workspace = true
re_log_types.workspace = true
re_test_context.workspace = true
re_view_bar_chart.workspace = true
re_view_tensor.workspace = true
re_view_text_document.workspace = true
re_view_state_timeline.workspace = true
re_view_text_log.workspace = true
re_view_time_series.workspace = true

arrow.workspace = true
datafusion.workspace = true
directories.workspace = true
futures.workspace = true
insta.workspace = true
ndarray.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
uuid.workspace = true

[lints]
workspace = true
