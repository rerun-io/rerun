[package]
name = "test_image_memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["rerun/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["rerun/crypto-aws-lc-rs"]

[dependencies]
re_format.workspace = true
re_memory.workspace = true
rerun = { workspace = true, features = ["sdk", "image"] }

mimalloc.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
