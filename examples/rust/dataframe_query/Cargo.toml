[package]
name = "dataframe_query"
version = "0.41.0-alpha.1+dev"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["rerun/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["rerun/crypto-aws-lc-rs"]

[dependencies]
rerun = { path = "../../../crates/top/rerun", default-features = false, features = ["dataframe"] }

itertools.workspace = true
unindent.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
