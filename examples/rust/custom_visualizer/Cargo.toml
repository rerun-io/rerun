[package]
name = "custom_visualizer"
version = "0.41.0-alpha.1+dev"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[features]
## Use Ring for native cryptography (the default).
crypto-ring = ["rerun/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["rerun/crypto-aws-lc-rs"]

default = ["crypto-ring"]

# Turn on if you want to share analytics with Rerun (e.g. callstacks on crashes).
analytics = ["rerun/analytics"]

[dependencies]
rerun = { path = "../../../crates/top/rerun", default-features = false, features = [
  "native_viewer",
  "run",
  "server",
  "video",
  "log_setup",
] }

# Need a direct dependency for `#[derive(bytemuck::Pod, bytemuck::Zeroable)]`.
bytemuck.workspace = true

# mimalloc is a much faster allocator:
mimalloc.workspace = true

[build-dependencies]
re_build_tools = { path = "../../../crates/build/re_build_tools" }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
