[package]
name = "custom_importer"
version = "0.39.0-rc.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
crossbeam.workspace = true
re_quota_channel = { path = "../../../crates/utils/re_quota_channel" }
rerun = { path = "../../../crates/top/rerun", features = ["native_viewer", "run", "log_setup"] }

[build-dependencies]
re_build_tools = { path = "../../../crates/build/re_build_tools" }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
