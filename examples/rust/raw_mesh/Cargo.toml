[package]
name = "raw_mesh"
version = "0.40.0-alpha.1+dev"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rerun = { path = "../../../crates/top/rerun", features = [
  "web_viewer",
  "clap",
  "ecolor",
  "log_setup",
] }

anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
gltf.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
