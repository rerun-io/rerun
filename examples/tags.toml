# The master list of tags allowed in example READMEs.
#
# Tags group examples on <https://rerun.io/examples>, so every example that is about the same
# thing must use the exact same spelling. Before adding a tag here, check whether an existing
# tag already covers it.
#
# Conventions, in the words of the tags in `examples/python/template/README.md`:
# "Human case", "Comma", "Separated", "ACRONYM", "Respect brand names", "Hugging Face", "Coca-Cola".
#
# `scripts/ci/example_tags.py check` enforces this list, and
# `scripts/ci/example_tags.py similar` reports tags close enough to be duplicates.

# Pairs of tags that look like duplicates but are not. Add to this only when the two tags
# really do mean different things.
distinct_pairs = [["Egocentric", "Exocentric"]]

