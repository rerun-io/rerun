[project]
name = "llm_embedding_ner"
version = "0.1.0"
requires-python = "<3.12" # TODO(ab): remove when torch is umap-learn/numba is 3.12 compatible
readme = "README.md"
dependencies = [
  "rerun-sdk",
  "torch",
  "transformers>=5.5.0", # >=5.5.0 clears three code-execution advisories in 4.x
  "umap-learn",
]

[project.scripts]
llm_embedding_ner = "llm_embedding_ner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
