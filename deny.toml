# https://github.com/EmbarkStudios/cargo-deny
#
# cargo-deny checks our dependency tree for copy-left licenses,
# duplicate dependencies, and rustsec advisories (https://rustsec.org/advisories).
#
# Install: `cargo install cargo-deny`
# Check: `cargo deny check`.
#
# For finding duplicate dependencies:  cargo deny check bans --hide-inclusion-graph


# Note: `cargo deny check` is run without `--target` so that all of the triples below are
# evaluated in one pass. Checking them one at a time makes a platform-conditional `ignore`
# unused on every other triple, which `unused-ignored-advisory = "deny"` rejects.
[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "i686-pc-windows-gnu" },
  { triple = "i686-pc-windows-msvc" },
  { triple = "i686-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-pc-windows-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-unknown-linux-musl" },
  { triple = "x86_64-unknown-redox" },
]
all-features = true


[advisories]
version = 2
unused-ignored-advisory = "deny"
# `unsound` defaults to `workspace` scope, which silently skips transitive deps;
# `unmaintained` already defaults to `all`.
unsound = "all"
ignore = [
  # `paste` is a proc-macro: it expands at compile time and contributes no runtime code, so being
  # unmaintained is a supply-chain concern rather than a reachability one.
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 via lance-bitpacking 10.0.0, mcap 0.25.0, parquet 58.3.0, re_rav1d 0.1.3, re_query (re-export only) and re_string_interner (one `paste!`). Not exercised because it is a proc-macro with no runtime code. Blocked by lance-bitpacking 12.0.0, mcap 0.25.0 and re_rav1d 0.1.3 (all latest) requiring paste ^1, and by parquet before 59.2.0, which needs arrow 59. Remove when those parents drop paste and re_query/re_string_interner stop using it. No ticket yet." },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 via http-cache 0.21.0 <- http-cache-reqwest 0.16.0 <- walkers 0.58.0 <- re_view_map, via puffin 0.20.0 (default `serialization` feature, through profiling <- eframe), and directly in re_server. Exercised: re_server encodes upload claims and chunk keys with it; the advisory is unmaintained status, not a vulnerability, and covers every bincode release including 2.x. Blocked by puffin 0.20.0 (latest) requiring bincode ^1.3 and by our own re_server use. Remove when walkers 0.60.0+ is adopted (its http-cache 1.0 alpha uses postcard), puffin drops bincode, and re_server moves to a maintained encoder. No ticket yet." },
  # Both pyo3 advisories are scoped to functions we never call. `rerun_py` and `re_protos` contain no
  # `.nth(`, `.nth_back(` or `new_closure` calls, and their one `PyTuple` is iterated with `for`.
  # Re-check when `arrow-pyarrow` or `numpy` moves, since they also link pyo3.
  { id = "RUSTSEC-2026-0176", reason = "pyo3 0.28.3 via rerun_py, re_protos, arrow-pyarrow 58.3.0 and numpy 0.28.0 (shipped Python SDK). Not exercised because nothing calls `nth`/`nth_back` on PyList or PyTuple iterators (see comment above). Blocked by arrow-pyarrow 58.3.0 requiring pyo3 ^0.28; pyo3 ^0.29 needs arrow-pyarrow 59.1.0+, so arrow 59, and lance 12.0.0 (latest) still requires arrow ^58. Remove when a Lance release on arrow 59 is adopted along with numpy 0.29.0. RR-4865" },
  { id = "RUSTSEC-2026-0177", reason = "pyo3 0.28.3 via rerun_py, re_protos, arrow-pyarrow 58.3.0 and numpy 0.28.0 (shipped Python SDK). Not exercised because nothing calls `PyCFunction::new_closure` (see comment above). Blocked by arrow-pyarrow 58.3.0 requiring pyo3 ^0.28; pyo3 ^0.29 needs arrow-pyarrow 59.1.0+, so arrow 59, and lance 12.0.0 (latest) still requires arrow ^58. Remove when a Lance release on arrow 59 is adopted along with numpy 0.29.0. RR-4865" },
  # Three quick-xml paths below the 0.41 fix. Both advisories are parser denial-of-service, so the
  # exposure is a malformed model file stalling or ballooning the Viewer, not memory unsafety.
  #  - 0.36.2 via `minidom-14` 0.17.0 <- `dae-parser` 0.11.0 <- `re_renderer`. Exercised: it parses
  #    COLLADA files the user opens.
  #  - 0.39.4 via `urdf-rs` 0.10.0 <- `re_importer`. Exercised: it parses URDF files the user opens.
  #  - 0.36.2 via `zbus_xml` 5.0.2 <- `zbus-lockstep` 0.5.1 <- `atspi-common` <- `accesskit_unix` (Linux).
  #    Build time only: `zbus-lockstep-macros` parses the AT-SPI XML shipped in `atspi-common`, and the
  #    runtime uses are under `#[cfg(test)]`. `zbus_xml` 5.2.1 drops quick-xml and fits `^5.0.1`.
  # `re_workspace_hack` also lists 0.36.2, as a feature-unification shim only.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36.2 via minidom-14 <- dae-parser <- re_renderer and zbus_xml <- zbus-lockstep <- atspi-common, and 0.39.4 via urdf-rs <- re_importer. Exercised: dae-parser and urdf-rs parse user-opened model files, so a malformed file can stall the Viewer (see comment above). Blocked by minidom-14 0.17.0 requiring ^0.36 and urdf-rs 0.10.0 requiring ^0.39, both latest. Remove when both allow 0.41 and zbus_xml is updated to 5.2.1. No ticket yet." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36.2 via minidom-14 <- dae-parser <- re_renderer and zbus_xml <- zbus-lockstep <- atspi-common, and 0.39.4 via urdf-rs <- re_importer. Exercised: dae-parser and urdf-rs parse user-opened model files, so a malformed file can exhaust memory (see comment above). Blocked by minidom-14 0.17.0 requiring ^0.36 and urdf-rs 0.10.0 requiring ^0.39, both latest. Remove when both allow 0.41 and zbus_xml is updated to 5.2.1. No ticket yet." },
  # The advisory is scoped to `advise_range`/`unchecked_advise_range`/`flush_range`/`flush_async_range`.
  # cacache (content/write.rs) only calls `MmapMut::map_mut` and the whole-map `flush_async()`, whose
  # range is always the map itself, so none of the affected functions run.
  { id = "RUSTSEC-2026-0186", reason = "memmap2 0.5.10 via cacache 13.1.0 <- http-cache 0.21.0 <- http-cache-reqwest 0.16.0 <- walkers 0.58.0 <- re_view_map. Not exercised because cacache never calls the affected range functions (see comment above). Blocked by cacache 13.1.0 (latest) requiring memmap2 ^0.5.8; walkers 0.60.0 still uses cacache, so updating walkers does not lift this. Remove when cacache allows memmap2 0.9.11+ or walkers drops cacache. No ticket yet." },
]


[bans]
multiple-versions = "deny"
wildcards = "allow" # We use them for examples
deny = [
  # Deny `auto_generate_cdp` for anything but integration tests, since it's GPL.
  { name = "auto_generate_cdp", wrappers = [
    "headless_chrome",
  ], reason = "May only ever be used in tests since it's GPL-3.0" },
  { name = "headless_chrome", wrappers = [
    "re_integration_test",
  ], reason = "Pulls in a GPL-3.0 crate so may only ever be used in tests." },

  { name = "cgmath", reason = "We use glam" },
  { name = "cmake", reason = "Never again" },
  { name = "derive_more", wrappers = [
    "agent-client-protocol-schema",
  ], reason = "Is very slow to compile; see https://github.com/rerun-io/rerun/issues/1316. Only allowed via the ACP schema crate, which we do not control." },
  { name = "egui_glow", reason = "We use wgpu" },
  { name = "openssl-sys", reason = "We prefer rustls" },
  { name = "openssl", reason = "We prefer rustls" },
  { name = "protobuf_src", reason = "We don't want to force users to compile protoc" },
  { name = "protoc-prebuilt", reason = "Downloads protoc at build time without checksum verification; objectron uses protoc-bin-vendored instead" },

  # We have to allow egui_kittest since we use it behind a `testing` feature flag, rather than just as a dev-dependency.
  #{ name = "egui_kittest", reason = "Only allowed as a dev-dependency for testing." },

  # We have to allow insta because it's used by `re_redap_tests`, which contains test code
  #{ name = "insta", reason = "Only allowed as a dev-dependency for testing." },
]
skip = [
  { name = "accesskit_consumer" }, # `egui_mcp` uses a newer version than the viewer's `eframe`/`accesskit_winit`.
  { name = "base64" }, # Too popular
  { name = "bitflags" }, # core-graphics & png uses an older version.
  { name = "block-buffer" }, # DataFusion 54 uses the sha2 0.11 stack while the rest of the ecosystem uses 0.10.
  { name = "block2" }, # Old version via rfd
  { name = "console" }, # smallish
  { name = "core-foundation" }, # Currently, e.g. `webbrowser` and `winit` use different versions.
  { name = "cpufeatures" }, # DataFusion 54 uses the sha2 0.11 stack while the rest of the ecosystem uses 0.10.
  { name = "crypto-common" }, # DataFusion 54 uses the sha2 0.11 stack while the rest of the ecosystem uses 0.10.
  { name = "digest" }, # DataFusion 54 uses the sha2 0.11 stack while the rest of the ecosystem uses 0.10.
  { name = "getrandom" }, # ring uses 0.2, ahash/arrow/datafusion use 0.3
  { name = "hashbrown" }, # Old version used by polar-rs
  { name = "itertools" }, # Too popular; `datafusion` requires 0.14, we use 0.15
  { name = "kurbo" }, # Different versions in egui_extras/resvg and epaint/vello_cpu
  { name = "libloading" }, # datafusion-ffi needs an older version than wgpu
  { name = "linux-raw-sys" }, # because of two rustix versions.
  { name = "memmap2" }, # because of walkers
  { name = "nom" }, # `tinyaudio` → `coreaudio-sys` builds with `bindgen 0.72`, which uses an older version than `lance`.
  { name = "objc2-app-kit" }, # `accesskit_macos` uses a different version than `arboard`
  { name = "objc2-foundation" }, # `accesskit_macos` uses a different version than `arboard`
  { name = "objc2" }, # `accesskit_macos` uses a different version than `arboard`
  { name = "ordered-float" }, # Old version being used by parquet, but super small!
  { name = "png" }, # `resvg` (via egui_extras) still uses 0.17, `walkers` forces us on 0.18 via `image`.
  { name = "pollster" }, # `rfd` still uses 0.4, we use 1.0
  { name = "shlex" }, # `tinyaudio` → `coreaudio-sys` builds with `bindgen 0.72`, which uses an older version than `cc`.
  { name = "strum" }, # `agent-client-protocol-schema` uses 0.28, we are still on 0.26
  { name = "strum_macros" }, # `agent-client-protocol-schema` uses 0.28, we are still on 0.26
  { name = "prettyplease" }, # `prost-build`/`tonic-build` use 0.2; `re_types_builder` uses 0.3, which takes the `syn` 3 AST. Build-time only.
  { name = "quick-xml" }, # because of urdf-rs
  { name = "redox_syscall" }, # Plenty of versions in the wild
  { name = "rustc-hash" }, # numpy with compatible pyo3 requires different version than wgpu
  { name = "rustix" }, # tantivy uses an old version.
  { name = "sha2" }, # DataFusion 54 uses 0.11 while the rest of the ecosystem uses 0.10.
  { name = "unicode-width" }, # walkers depends on 0.1 via http-cache-request / cacache

  # Duplicated by `headless_chrome`, pulled in only by the `browser` feature of the
  # `re_integration_test` browser integration-test harness.
  { name = "convert_case" },
  { name = "rand" },
  { name = "rand_core" },
]
skip-tree = [
  # PREFER `skip` (above): `skip-tree` exempts the crate AND its whole transitive subtree from the
  # duplicate check, so it can silently hide unrelated new duplicates. Only use `skip-tree` when an
  # outdated root drags in a self-contained cluster of old deps that would be noise to list one-by-one.
  { name = "darling" }, # enumset_derive uses 0.21, serde_with_macros (via lance-namespace) uses 0.23
  { name = "petgraph" }, # b/c lance
  { name = "phf" }, # b/c mime_guess2
  { name = "thiserror" }, # Waiting for eco-system to switch to 2.0
  { name = "toml" }, # b/c cargo_metadata
  { name = "windows-sys" }, # Impossible
  { name = "zerocopy" }, # Need to update re_rav1d
]

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.93 # We want really high confidence when inferring licenses from text
allow = [
  "0BSD", # https://opensource.org/license/0bsd
  "Apache-2.0 WITH LLVM-exception", # https://spdx.org/licenses/LLVM-exception.html
  "Apache-2.0", # https://tldrlegal.com/license/apache-license-2.0-(apache-2.0)
  "BSD-2-Clause", # https://tldrlegal.com/license/bsd-2-clause-license-(freebsd)
  "BSD-3-Clause", # https://tldrlegal.com/license/bsd-3-clause-license-(revised)
  "BSL-1.0", # https://tldrlegal.com/license/boost-software-license-1.0-explained
  "CC0-1.0", # https://creativecommons.org/publicdomain/zero/1.0/
  "CDLA-Permissive-2.0", # https://cdla.dev/permissive-2-0/
  "ISC", # https://www.tldrlegal.com/license/isc-license
  "MIT-0", # https://choosealicense.com/licenses/mit-0/
  "MIT", # https://tldrlegal.com/license/mit-license
  "MPL-2.0", # https://www.mozilla.org/en-US/MPL/2.0/FAQ/ - see Q11. Used by webpki-roots on Linux.
  "OFL-1.1", # https://spdx.org/licenses/OFL-1.1.html
  "Ubuntu-font-1.0", # https://ubuntu.com/legal/font-licence
  "Unicode-3.0", # https://www.unicode.org/license.txt
  "Zlib", # https://tldrlegal.com/license/zlib-libpng-license-(zlib)
]
exceptions = [
  # Pulled in via headless-chrome. Only used during testing and never linked to any released binaries.
  { name = "auto_generate_cdp", allow = [
    "GPL-3.0-or-later",
  ] },
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The `walkers` entry that used to live here is gone: it carried the exit condition
# "remove once upstream releases an egui 0.36 version", and #3076 met it.
allow-git = []

# `Cargo.toml` tracks the `main` branch of `emilk/egui`, `emilk/egui_plot` and
# `rerun-io/egui_tiles` until the next egui release. Between such stretches there are no
# git dependencies and `cargo deny` reports the two organizations below as unmatched.
# They are kept anyway, and the warning accepted, so that uncommenting the git block in
# `Cargo.toml` stays a one-file change instead of failing CI with an unrelated
# `unknown-git` error.
[sources.allow-org]
github = ["emilk", "rerun-io"]
