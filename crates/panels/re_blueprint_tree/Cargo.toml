[package]
authors.workspace = true
description = "The UI for the blueprint tree in the left panel."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_blueprint_tree"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_context_menu/crypto-ring",
  "re_data_ui/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_context_menu/crypto-aws-lc-rs",
  "re_data_ui/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

default = ["crypto-ring"]
testing = ["dep:serde", "smallvec/serde", "re_viewer_context/testing"]

[dependencies]
re_context_menu.workspace = true
re_data_ui.workspace = true
re_entity_db.workspace = true
re_log.workspace = true
re_log_types.workspace = true
re_tracing.workspace = true
re_sdk_types.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

egui.workspace = true
egui_tiles.workspace = true
itertools.workspace = true
serde = { workspace = true, optional = true }
smallvec.workspace = true


[dev-dependencies]
re_chunk_store.workspace = true
re_test_context.workspace = true
re_test_viewport.workspace = true
re_view_spatial.workspace = true
re_viewport_blueprint.workspace = true

egui_kittest.workspace = true
insta = { workspace = true, features = ["redactions", "yaml"] }
smallvec = { workspace = true, features = ["serde"] }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
