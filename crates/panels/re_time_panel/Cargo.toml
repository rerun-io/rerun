[package]
authors.workspace = true
description = "The time panel of the Rerun Viewer, allowing to control the displayed timeline & time."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_time_panel"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_chunk_store/crypto-ring",
  "re_context_menu/crypto-ring",
  "re_data_ui/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_time_ruler/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_chunk_store/crypto-aws-lc-rs",
  "re_context_menu/crypto-aws-lc-rs",
  "re_data_ui/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_time_ruler/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

default = ["crypto-ring"]
testing = ["smallvec/serde"]

[dependencies]
re_byte_size.workspace = true
re_chunk.workspace = true
re_chunk_store.workspace = true
re_context_menu.workspace = true
re_data_ui.workspace = true
re_entity_db.workspace = true
re_format.workspace = true
re_log_types.workspace = true
re_log.workspace = true
re_sdk_types.workspace = true
re_time_ruler.workspace = true
re_tracing.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

ahash.workspace = true
egui.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
serde.workspace = true
smallvec.workspace = true
vec1.workspace = true

[dev-dependencies]
re_chunk.workspace = true
re_chunk_index.workspace = true
re_log_msg.workspace = true
re_test_context.workspace = true

anyhow.workspace = true
criterion.workspace = true
insta = { workspace = true, features = ["redactions", "yaml"] }
rand.workspace = true
smallvec = { workspace = true, features = ["serde"] }

[lib]
bench = false

[[bench]]
name = "bench_density_graph"
harness = false

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
