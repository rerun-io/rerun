[package]
authors.workspace = true
description = "The Rerun Viewer's agent panel: a coding agent that runs next to the viewer and drives it"
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_agent_panel"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../LICENSE-APACHE",
  "../../LICENSE-MIT",
  "**/*.rs",
  "agent_context/**/*.cpp",
  "agent_context/**/*.in",
  "agent_context/**/*.md",
  "agent_context/**/*.py",
  "agent_context/**/*.rs",
  "agent_context/**/*.toml",
  "agent_context/**/*.txt",
  "agent_context/**/*.yaml",
  "Cargo.toml",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = []

## Embed the Rerun skills and documentation for the agent panel to hand its agent.
##
## Costs a couple of megabytes of binary size, and does nothing on the web.
agent_context = []

[dependencies]
re_agent.workspace = true
re_agent_ui.workspace = true
re_analytics.workspace = true
re_async.workspace = true
re_entity_db.workspace = true
re_log.workspace = true
re_log_channel.workspace = true
re_protos.workspace = true
re_sdk_types.workspace = true
re_tracing.workspace = true
re_ui.workspace = true
re_viewer_control_tools.workspace = true

crossbeam.workspace = true
egui.workspace = true
futures.workspace = true
jiff = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true

[dev-dependencies]
insta.workspace = true

[build-dependencies]
cfg_aliases.workspace = true
re_build_tools.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
