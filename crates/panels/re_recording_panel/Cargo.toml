[package]
authors.workspace = true
description = "The UI for the recording panel."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_recording_panel"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_data_ui/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_redap_browser/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_data_ui/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_redap_browser/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
]

default = ["crypto-ring"]
testing = ["dep:serde", "re_viewer_context/testing"]

[dependencies]
re_data_ui.workspace = true
re_entity_db.workspace = true
re_log.workspace = true
re_log_types.workspace = true
re_redap_browser.workspace = true
re_log_channel.workspace = true
re_sdk_types.workspace = true
re_tracing.workspace = true
re_ui.workspace = true
re_uri.workspace = true
re_viewer_context.workspace = true

ahash.workspace = true
egui.workspace = true
itertools.workspace = true
serde = { workspace = true, optional = true }


[dev-dependencies]
re_log_channel.workspace = true
re_log_msg.workspace = true
re_test_context.workspace = true

egui_kittest.workspace = true
insta = { workspace = true, features = ["redactions", "yaml"] }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
