[package]
name = "re_tf"
authors.workspace = true
description = "Rerun spatial transform processing"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["re_chunk_store/crypto-ring", "re_entity_db/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_chunk_store/crypto-aws-lc-rs", "re_entity_db/crypto-aws-lc-rs"]

[dependencies]
re_arrow_util.workspace = true
re_byte_size = { workspace = true, features = ["glam"] }
re_chunk_index.workspace = true
re_chunk_store.workspace = true
re_entity_db.workspace = true # It would be nice not to depend on this, but we need this in order to do queries right now.
re_log_types.workspace = true
re_log.workspace = true
re_mutex.workspace = true
re_sdk_types = { workspace = true, features = ["glam"] }
re_tracing.workspace = true

ahash.workspace = true
arrow.workspace = true
bitflags.workspace = true
glam.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[dev-dependencies]
re_log = { workspace = true, features = ["setup"] }
re_log_msg.workspace = true
criterion.workspace = true
insta.workspace = true
mimalloc.workspace = true

[lib]
bench = false

[[bench]]
name = "transform_resolution_cache_bench"
harness = false

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
