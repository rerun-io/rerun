[package]
name = "re_data_source"
authors.workspace = true
description = "Handles loading of Rerun data"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_crypto/crypto-ring",
  "re_grpc_client/crypto-ring",
  "re_importer/crypto-ring",
  "re_log_encoding/crypto-ring",
  "re_redap_client/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_crypto/crypto-aws-lc-rs",
  "re_grpc_client/crypto-aws-lc-rs",
  "re_importer/crypto-aws-lc-rs",
  "re_log_encoding/crypto-aws-lc-rs",
  "re_redap_client/crypto-aws-lc-rs",
]

default = ["crypto-ring"]


[dependencies]
re_async.workspace = true
re_crypto.workspace = true
re_importer.workspace = true
re_format.workspace = true
re_grpc_client.workspace = true
re_log_channel.workspace = true
re_log_encoding = { workspace = true, features = ["decoder", "stream_from_http"] }
re_log_msg.workspace = true
re_log_types.workspace = true
re_log.workspace = true
re_redap_client.workspace = true
re_tracing.workspace = true
re_uri.workspace = true

anyhow.workspace = true
ehttp.workspace = true
rayon.workspace = true
url.workspace = true

# web dependencies:
[target.'cfg(target_arch = "wasm32")'.dependencies]
re_web.workspace = true
web-sys = { workspace = true, features = ["File"] }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
