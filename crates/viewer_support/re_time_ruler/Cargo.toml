[package]
authors.workspace = true
description = "Time ruler widget shared by the time panel and time-aware views."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_time_ruler"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["re_ui/crypto-ring", "re_viewer_context/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_ui/crypto-aws-lc-rs", "re_viewer_context/crypto-aws-lc-rs"]

[dependencies]
re_format.workspace = true
re_log.workspace = true
re_log_types.workspace = true
re_sdk_types.workspace = true
re_tracing.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true

egui.workspace = true
itertools.workspace = true

[lib]
bench = false

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
