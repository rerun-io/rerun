[package]
authors.workspace = true
description = "Rich table widget over DataFusion."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_dataframe_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_analytics/crypto-ring",
  "re_arrow_ui/crypto-ring",
  "re_chunk_store/crypto-ring",
  "re_data_source/crypto-ring",
  "re_dataframe/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_redap_client/crypto-ring",
  "re_ui/crypto-ring",
  "re_view/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_analytics/crypto-aws-lc-rs",
  "re_arrow_ui/crypto-aws-lc-rs",
  "re_chunk_store/crypto-aws-lc-rs",
  "re_data_source/crypto-aws-lc-rs",
  "re_dataframe/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_redap_client/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_view/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

default = ["crypto-ring"]

