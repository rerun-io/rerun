[package]
authors.workspace = true
description = "Provides ui elements for Rerun component data for the Rerun Viewer."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_data_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_arrow_ui/crypto-ring",
  "re_chunk_store/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_query/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_arrow_ui/crypto-aws-lc-rs",
  "re_chunk_store/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_query/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

[dependencies]
re_arrow_ui.workspace = true
re_capabilities = { workspace = true, features = ["egui"] }
re_chunk_store.workspace = true
re_entity_db.workspace = true
re_format.workspace = true
re_log.workspace = true
re_log_channel.workspace = true
re_log_msg.workspace = true
re_log_types.workspace = true
re_query.workspace = true
re_renderer.workspace = true
re_sdk_types = { workspace = true, features = [
  "egui_plot", # Needed to draw marker shapes.
] }
re_sorbet.workspace = true
re_tracing.workspace = true
re_types_core.workspace = true
re_ui.workspace = true
re_uri.workspace = true
re_video = { workspace = true, features = ["ffmpeg"] }
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

ahash.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
egui.workspace = true
itertools.workspace = true
jiff.workspace = true
rexif.workspace = true
unindent.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
