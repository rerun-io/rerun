[package]
authors.workspace = true
description = "Types & utilities for defining view classes and communicating with the viewport."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_view"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_chunk_store/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_query/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_chunk_store/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_query/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

default = ["crypto-ring"]

[dependencies]
re_arrow_util.workspace = true
re_chunk.workspace = true
re_lenses = { workspace = true, features = ["semantic"] }
re_lenses_core.workspace = true
re_chunk_store.workspace = true
re_entity_db.workspace = true
re_format.workspace = true
re_log_types.workspace = true
re_log.workspace = true
re_query.workspace = true
re_renderer.workspace = true
re_tracing.workspace = true
re_types_core.workspace = true
re_sdk_types.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

ahash.workspace = true
arrow.workspace = true
egui.workspace = true
glam.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
re_test_context.workspace = true
criterion.workspace = true

[lib]
bench = false

[[bench]]
name = "query_result_hash"
harness = false

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
