[package]
authors.workspace = true
description = "Talk to a coding agent (Claude Code, Codex, вЂ¦) over the Agent Client Protocol, or run an agent loop against a model API"
edition.workspace = true
homepage.workspace = true
license.workspace = true
include.workspace = true
name = "re_agent"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["re_crypto/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_crypto/crypto-aws-lc-rs"]

## Hooks for feeding an [`AgentSession`] without a running agent, used by UI snapshot tests.
testing = []

[dependencies]
re_async.workspace = true
re_crypto.workspace = true
re_log.workspace = true

agent-client-protocol-schema.workspace = true
base64.workspace = true
futures.workspace = true
reqwest013.workspace = true
rig-core.workspace = true
rig-reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
web-time.workspace = true

[dev-dependencies]
http.workspace = true
rig-core = { workspace = true, features = ["test-utils"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-client-protocol.workspace = true
crossbeam.workspace = true
tempfile.workspace = true

[build-dependencies]
cfg_aliases.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
