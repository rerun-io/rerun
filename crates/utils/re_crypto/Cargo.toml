[package]
name = "re_crypto"
authors.workspace = true
description = "Shared TLS crypto provider initialization for Rerun"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["crypto-ring"]

## Use Ring for native TLS.
crypto-ring = ["rustls/ring"]

## Use AWS-LC for native TLS.
## Takes precedence when both providers are enabled.
crypto-aws-lc-rs = ["rustls/aws-lc-rs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, features = ["std"] }

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
