[package]
authors.workspace = true
description = "Hardware video decoding straight to GPU textures, via Vulkan Video and VideoToolbox."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_gpu_video"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# This crate is native only, web builds must not include it.
[dependencies]
re_log.workspace = true
re_tracing.workspace = true

ash.workspace = true
cros-codecs.workspace = true
h264-reader.workspace = true
itertools.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-io-surface.workspace = true
objc2-metal.workspace = true
objc2-video-toolbox.workspace = true

[dev-dependencies]
re_log = { workspace = true, features = ["setup"] }

insta.workspace = true
pollster.workspace = true

[lib]
bench = false
