[package]
name = "re_crash_handler"
authors.workspace = true
description = "Detect panics and signals, logging them and optionally sending them to analytics."
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
## Use Ring for native cryptography (the default).
crypto-ring = ["re_analytics/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_analytics/crypto-aws-lc-rs"]

default = ["crypto-ring"]

[dependencies]
re_analytics.workspace = true
re_build_info.workspace = true

econtext.workspace = true
itertools.workspace = true
parking_lot.workspace = true

# Native dependencies:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
backtrace.workspace = true

# Native unix dependencies:
[target.'cfg(not(any(target_arch = "wasm32", target_os = "windows")))'.dependencies]
libc.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
