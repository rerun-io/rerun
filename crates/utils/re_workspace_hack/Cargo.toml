# The dependencies in this file are generated by `cargo hakari generate`, configured in `.config/hakari.toml`.
#
# Every workspace crate depends on this crate, but only when `cfg(rerun_workspace_hack)` is set,
# which `.cargo/config.toml` does. That keeps it out of builds that set `RUSTFLAGS` (which almost all of CI does),
# and out of wasm builds.
#
# crates.io has an empty version of this crate (no dependencies), which is what everyone outside
# this workspace gets (users of our published crates, and other workspaces using our crates by path).
# Inside this workspace, `[patch.crates-io]` in the root `Cargo.toml` replaces it with this one.
# To (re)publish the stub: `cargo hakari disable`, set `publish = true`, `cargo publish -p re_workspace_hack --allow-dirty`,
# then revert those changes.

[package]
name = "re_workspace_hack"
authors.workspace = true
description = "Unifies third-party dependency features across the workspace to avoid recompiles. Managed by cargo-hakari."
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.0.0" # Must match the stub on crates.io, which never changes.

[lints]
workspace = true

