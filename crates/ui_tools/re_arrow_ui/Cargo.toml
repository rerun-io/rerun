[package]
authors.workspace = true
description = "Show arrow data in a tree of rerun list_items and format arrow with syntax highlighting."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_arrow_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["re_ui/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_ui/crypto-aws-lc-rs"]

[dependencies]
re_format.workspace = true
re_span.workspace = true
re_tracing.workspace = true
re_ui.workspace = true

arrow.workspace = true
itertools.workspace = true
jiff.workspace = true
egui.workspace = true

[dev-dependencies]
re_sdk_types.workspace = true
re_ui = { workspace = true, features = ["testing"] }

egui_kittest.workspace = true
insta.workspace = true
re_arrow_util.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
