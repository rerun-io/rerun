[package]
authors.workspace = true
description = "Rerun GUI theme and helpers, built around egui"
edition.workspace = true
homepage.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND MIT AND Bitstream-Vera"
name = "re_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE-APACHE",
  "../../LICENSE-MIT",
  "**/*.rs",
  "Cargo.toml",
  "data/**/*.otf",
  "data/**/*.png",
  "data/**/*.ron",
  "data/**/*.svg",
  "data/**/*.ttf",
  "data/**/*.txt",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = []

## Enable helpers for testing
testing = ["dep:egui_kittest", "re_analytics/testing"]

[dependencies]
re_analytics.workspace = true
re_async.workspace = true # to run the fetch behind a `RequestedObject`
re_error.workspace = true
re_format.workspace = true
re_log = { workspace = true, features = ["setup"] }
re_mutex.workspace = true
re_quota_channel.workspace = true
re_span.workspace = true
re_tracing.workspace = true

ahash.workspace = true
anyhow.workspace = true
crossbeam.workspace = true
eframe = { workspace = true, default-features = false, features = ["wgpu"] }
egui_commonmark = { workspace = true, features = ["pulldown_cmark"] }
egui_extras.workspace = true
egui = { workspace = true, features = [
  "experimental", # The theme API, for `TextEditTheme`
] }
getrandom.workspace = true
itertools.workspace = true
jiff.workspace = true
num-traits.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec.workspace = true
strum_macros.workspace = true
strum.workspace = true
url.workspace = true


egui_kittest = { workspace = true, optional = true }

# Native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify.workspace = true # Only used with the `hot_reload_design_tokens` feature

# Mac-specific
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true

# Linux-specific
[target.'cfg(target_os = "linux")'.dependencies]
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "unstable"] }


[dev-dependencies]
egui_kittest.workspace = true
egui_tiles.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }
re_quota_channel.workspace = true
re_redap_client.workspace = true # to exercise the real error formatting in tests
re_uri.workspace = true
static_assertions.workspace = true
tonic.workspace = true


[build-dependencies]
re_build_tools.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
