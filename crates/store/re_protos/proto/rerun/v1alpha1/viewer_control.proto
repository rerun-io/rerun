// Remote control of a running viewer: `ViewerControlService`.
//
// This interface is in flux. It carries no backwards-compatibility guarantee yet: operations,
// fields, and field numbers may change or disappear between releases.
//
// Served on the same endpoint as `rerun/v1alpha1/sdk_comms.proto`, but its own package, so the
// generated code lands in its own file. Serving several packages on one port is normal here:
// the viewer already serves `rerun.cloud.v1alpha1` alongside these two.
//
// Adding an operation means editing two files:
//
//   crates/store/re_protos/src/v1alpha1/rerun.viewer_control.v1alpha1.ext.rs
//     One line in the `viewer_control_ops!` table, pairing the request with its response.
//   crates/top/re_viewer/src/app/viewer_control.rs
//     A match arm in `serve_viewer_control`, and what the operation does to the viewer.
//
// Optionally, to reach Python:
//
//   rerun_py/src/viewer.rs
//     A `PyViewerClientInternal` method sending the one RPC and validating the response variant.
//   rerun_py/rerun_sdk/rerun/experimental/_viewer_client.py
//     The public `ViewerClient` method, with keyword arguments and a docstring.
//
// Nothing else needs touching. The transports carry `ViewerControlRequest` without looking
// inside it, and `crates/top/re_viewer_mcp/src/proto_tools.rs` derives the MCP tool, its JSON
// Schema, and its description from this file's comments, so an operation added here becomes an
// agent-facing tool on its own.
//
// `EguiInspect` is handled separately, since it is a very different (more low-level) kind of operation
// ("click here", "look there", …).
//
// Comments here are user-facing: they become the tool descriptions an agent reads.

syntax = "proto3";

package rerun.viewer_control.v1alpha1;

import "rerun/v1alpha1/cloud.proto";
import "rerun/v1alpha1/common.proto";

// Remote control of a running viewer.
//
// The viewer serves this alongside its SDK comms endpoint. `re_viewer_mcp` is the main client:
// it drives the viewer on behalf of an agent.
//
// `ViewerControl` carries every viewer-control operation in one `oneof`, rather than one RPC per
// operation, so that every client speaks the same envelope. Transports that cannot serve gRPC —
// notably the wasm viewer, which has no server at all — accept the same encoded
// `ViewerControlRequest` and return the same `ViewerControlResponse`, without restating the
// operation set per transport.
//
// `EguiInspect` is deliberately *not* one of those operations. It is an opaque tunnel for a
// different protocol, driving widgets rather than naming a viewer action, and its payload means
// nothing to this service. Keeping it out of the `oneof` keeps the envelope a list of things the
// viewer can be asked to do.
service ViewerControlService {
  // Perform one viewer-control operation, named by the request's `kind`.
  //
  // The response `kind` always matches the request `kind`. Failures come back as gRPC status
  // codes, never as a response variant.
  rpc ViewerControl(ViewerControlRequest) returns (ViewerControlResponse) {}

  // One `egui_inspection` request/response exchange, driving the viewer's widgets directly.
  //
  // The bodies are opaque to this service: `egui_mcp`'s UI tools (`click`, `widget_tree`,
  // `screenshot`, …) encode them, and the viewer's `egui_inspection` plugin services them.
  rpc EguiInspect(EguiInspectRequest) returns (EguiInspectResponse) {}
}

// One viewer-control operation to perform.
message ViewerControlRequest {
  // Which operation to perform. A request with no `kind` set is `INVALID_ARGUMENT`.
  oneof kind {
    // Close recordings in the viewer, to clear away what is no longer needed.
    //
    // This only removes them from the viewer. Files on disk are untouched, and registered
    // recordings stay in the catalog and can be reopened, but unsaved blueprint edits are lost.
    //
    // Iterating on a file you keep regenerating leaves a pile of stale recordings behind, which
    // makes the viewer state and the UI hard to read.
    //
    // `NOT_FOUND` if the requested recording is not open.
    CloseRecordingsRequest close_recordings = 1;

    // Return the viewer's recent log messages (INFO and above), oldest first, so a caller sees the
    // warnings and errors the user sees. A warning here usually explains what the user is seeing.
    //
    // Entries carry a sequence number, so passing the last one back fetches only what is new.
    GetViewerLogsRequest get_viewer_logs = 2;

    // Report what the viewer is currently showing, so a caller can orient itself.
    //
    // Covers the active recording, the current page URL, every open recording with its timelines,
    // their time ranges and its current time cursor, and every view of the current blueprint with
    // the warnings and errors that view reports.
    //
    // Call this to learn which recording and timeline to drive, and which time values are valid,
    // before moving the time cursor. A view's reports say what failed to visualize.
    //
    // Recordings are named by a store id string, `{kind}:{application_id}:{recording_id}`, e.g.
    // `Recording:my_app:1830B33B45B963E7`. Pass it back whole wherever an operation takes a
    // recording. To read a part out of one: the kind runs to the first colon, the application id
    // to the next colon that is not preceded by a backslash, and the recording id is the rest.
    // Both ids may contain a colon, so the application id's are escaped as `\:` (and `\` as `\\`).
    GetViewerStateRequest get_viewer_state = 3;

    // Open a URL in the viewer (a recording/blueprint file, a `rerun://` dataset URI, a redap
    // server/catalog URL, or an intra-recording link). A recording it opens, such as a dataset
    // segment, becomes the active recording and is shown.
    //
    // Returns once the initial load is done, or after about ten seconds, whichever comes first.
    // What the initial load covers depends on the URL:
    // * A file or HTTP URL that is opened directly: the whole file is read.
    // * A file registered with the viewer catalog (the default for `.rrd`), or a dataset segment
    //   on a server: the recording's chunk index (manifest) has arrived. The chunks themselves
    //   are fetched on demand afterwards, and need not all fit in memory.
    // * Anything else (a server, a catalog entry, an intra-recording link): the viewer has acted
    //   on it.
    // If the response says `still_loading`, poll `GetViewerState` until its `loading` list
    // is empty; only then does an absent timeline mean an empty recording rather than one still
    // arriving. Do not drive the UI while it loads — a viewer busy importing paints no frames,
    // so anything waiting on one stalls, while `GetViewerState` keeps answering.
    OpenUrlRequest open_url = 4;

    // Take a screenshot of the viewer, or of a single view within it, and write it to disk.
    //
    // The screenshot is saved by the viewer process, so the path is resolved on the machine
    // running the viewer, not on the machine making the request.
    //
    // Fails with `INVALID_ARGUMENT` if `view_id` is not a UUID, `NOT_FOUND` if no such view is
    // currently visible, `FAILED_PRECONDITION` if the view is too small to capture, and
    // `INTERNAL` if the capture itself or the write to disk failed.
    SaveScreenshotRequest save_screenshot = 5;

    // Move the time cursor (timeline position) of a recording in the viewer.
    SetTimeCursorRequest set_time_cursor = 6;

    // Report a recording's schema: its timelines, every entity, every component ever logged on
    // it, whether that component has a static value, and its Arrow datatype.
    //
    // `paths_only` answers the cheaper question — which entities exist at all — for a recording
    // too large to describe in full.
    //
    // Read this before naming an entity path or a component anywhere else. A component name
    // guessed from an archetype's documentation is often not the one the recording carries, and
    // the viewer cannot tell a caller that it guessed wrong — a query for a component that is not
    // there just comes back empty.
    //
    // This is the schema, not the data: a component listed here has been logged at some point,
    // which says nothing about the current time cursor. Read values through the catalog server
    // `GetViewerState` reports as `catalog_url`.
    //
    // `NOT_FOUND` if the requested recording is not open.
    GetRecordingSchemaRequest get_recording_schema = 7;

    // Draw a pulsing outline on top of the viewer, to point the user at something on screen.
    //
    // The outline keeps pulsing until the user clicks anywhere, which dismisses it. There is at
    // most one highlight at a time: highlighting again replaces the previous one.
    //
    // Use it to show the user where the thing you are talking about is, rather than describing
    // its position in prose.
    HighlightRectRequest highlight_rect = 8;

    // List the ids of the viewer's command palette commands (panels, playback, undo, …).
    //
    // Prefer this over clicking through the UI. The ids are self-describing, so the list is
    // usually enough; use `DescribeCommands` for details on a few.
    ListCommandsRequest list_commands = 9;

    // Describe commands by id. `NOT_FOUND` if any id is unknown.
    DescribeCommandsRequest describe_commands = 10;

    // Run a command palette command by id.
    //
    // Returns once queued; verify the effect with `GetViewerState` or a screenshot.
    // Commands that open a native modal are refused unless `allow_blocking_native_modal` is set.
    // Ask the user before running a `destructive` command.
    RunCommandRequest run_command = 11;

    // Read regular blueprints (per-recording or per-segment views and layouts) or table blueprints
    // (tables, card layouts, and preview cells) as JSON, keyed by blueprint entity path, then
    // archetype, then field. Use `recording` for a regular blueprint and `table` for a table blueprint.
    //
    // A recording's blueprint has the layout, views, their properties and overrides. A table's
    // blueprint only has what it sets, such as row filters, the layout, and column settings, so a
    // table that was never configured gives `{}`. `GetTableSchema` names all columns of a table.
    //
    // Set exactly one of `recording` and `table`, such as `{"recording": {}}` or
    // `{"table": {"table_url": "…"}}`. Without a `store_id` it reads the active recording's
    // blueprint, and without a `table_url` the blueprint of the table on screen. The response
    // names the recording or table it read. A recording or table without a blueprint yet gets
    // the one showing it would give it.
    //
    // `INVALID_ARGUMENT` if neither `recording` nor `table` is set. `FAILED_PRECONDITION` if the
    // default recording or table is not there. `NOT_FOUND` if the recording is not open or the
    // viewer does not know the table.
    GetBlueprintRequest get_blueprint = 12;

    // Record a puffin profile of the next frames the viewer paints, and write it to disk as a
    // `.puffin` file.
    //
    // The viewer keeps repainting while it records, so this finishes even when nothing changes on
    // screen. It answers when the file is written. Use the `investigate-puffin` skill
    // to analyze the trace.
    //
    // Fails with `INVALID_ARGUMENT` if `num_frames` is out of range, `FAILED_PRECONDITION` if
    // another profile capture is still running or on the web viewer, and `INTERNAL` if the write
    // to disk failed.
    CaptureProfileTraceRequest capture_profile_trace = 13;

    // Set regular blueprints (per-recording or per-segment views and layouts) or table blueprints
    // (customize tables, enable card layouts, and add preview cells) with JSON, in the form
    // `GetBlueprint` reads. Use `recording` for a regular blueprint and `table` for a table blueprint.
    // Read the `table` input field's documentation for the table, card, and preview configuration interface.
    //
    // The JSON is the whole blueprint: anything it leaves out is cleared. A field holding a
    // single value may be written as that value or as an array of one. Exactly one of
    // `recording` and `table` picks whose blueprint to write, as for `GetBlueprint`, and the
    // response names which one it wrote.
    //
    // ## Tables
    //
    // To change how a table looks, write its blueprint with this rather than clicking through the
    // viewer's Columns menu. Read the column names with `GetTableSchema` and the blueprint with
    // `GetBlueprint` first, and keep what it returned. `column_order` in `TableLayout` sets the
    // order, and a column's `TableColumn` sets its `name` and `visible`. Row filters go in
    // `filters` of `TableBlueprint` at `/table`.
    //
    // Rows show either as a table or as cards with segment previews. A request about columns or
    // rows only changes the table layout, so write it without asking. For any other request, such
    // as to make a table look nice, ask the user before the first write which layout they want and
    // what it shows, unless they already said.
    // The docs of `table` describe how to write a table blueprint, with examples of both layouts.
    //
    // ## Errors
    //
    // `INVALID_ARGUMENT` says where the JSON or a table filter is wrong. Filters are only checked
    // against a table that has been shown. `INVALID_ARGUMENT` too if neither `recording` nor
    // `table` is set.
    // `FAILED_PRECONDITION` if the default recording or table is not there. `NOT_FOUND` if the
    // recording is not open or the viewer does not know the table.
    SetBlueprintRequest set_blueprint = 14;

    // Name a table's columns in display order, as last shown: the name a table blueprint uses,
    // the header name, and the Arrow datatype. Read it before writing a table blueprint.
    //
    // `FAILED_PRECONDITION` if no `table_url` is given and no table is on screen. `NOT_FOUND` if
    // the viewer does not know the table or has not shown it yet, so open it with `OpenUrl`.
    GetTableSchemaRequest get_table_schema = 17;

    // Describe a dataset on a server: the entities of all its segments and the components logged
    // on each, in the form `GetRecordingSchema` describes one recording. Nothing is opened or
    // loaded, so read it to learn what a dataset holds before opening any of it.
    //
    // It names the entities in the segments, not a table's columns. For the columns of a table,
    // such as to change how a table looks, call `GetTableSchema` instead.
    //
    // This is the schema, not the data: a component listed here has been logged in some segment,
    // not necessarily in all of them.
    //
    // `FAILED_PRECONDITION` if no `dataset_url` is given and no dataset is on screen.
    // `INVALID_ARGUMENT` if `dataset_url` is not a dataset, or without it if a table is on screen. `NOT_FOUND` if the viewer does not
    // know the dataset, or nothing in it is at or below `entity_path`.
    GetDatasetSchemaRequest get_dataset_schema = 18;
  }
}

// The result of one viewer-control operation.
message ViewerControlResponse {
  // Always the same variant as the request's `kind`.
  oneof kind {
    // Result of `close_recordings`.
    CloseRecordingsResponse close_recordings = 1;

    // Result of `get_viewer_logs`.
    GetViewerLogsResponse get_viewer_logs = 2;

    // Result of `get_viewer_state`.
    GetViewerStateResponse get_viewer_state = 3;

    // Result of `open_url`.
    OpenUrlResponse open_url = 4;

    // Result of `save_screenshot`.
    SaveScreenshotResponse save_screenshot = 5;

    // Result of `set_time_cursor`.
    SetTimeCursorResponse set_time_cursor = 6;

    // Result of `get_recording_schema`.
    GetRecordingSchemaResponse get_recording_schema = 7;

    // Result of `highlight_rect`.
    HighlightRectResponse highlight_rect = 8;

    // Result of `list_commands`.
    ListCommandsResponse list_commands = 9;

    // Result of `describe_commands`.
    DescribeCommandsResponse describe_commands = 10;

    // Result of `run_command`.
    RunCommandResponse run_command = 11;

    // Result of `get_blueprint`.
    GetBlueprintResponse get_blueprint = 12;

    // Result of `capture_profile_trace`.
    CaptureProfileTraceResponse capture_profile_trace = 13;

    // Result of `set_blueprint`.
    SetBlueprintResponse set_blueprint = 14;
    // Result of `get_table_schema`.
    GetTableSchemaResponse get_table_schema = 17;

    // Result of `get_dataset_schema`.
    GetDatasetSchemaResponse get_dataset_schema = 18;
  }
}

// ----------------------------------------------------------------------------
// CloseRecordings

// Request for `CloseRecordings`.
message CloseRecordingsRequest {
  // The recordings to close. Exactly one selector, like a Rust enum: there is no default target.
  oneof target {
    // Close the active recording. Must be `true`: this is a selector, not a flag.
    bool current = 1;

    // Close every open recording. Must be `true`: this is a selector, not a flag.
    bool all = 2;

    // Close these recordings.
    ViewerRecordingIds store_ids = 3;
  }
}

// Recording ids selected by `CloseRecordings`.
message ViewerRecordingIds {
  // The recording ids to close, each as `{kind}:{application_id}:{recording_id}`.
  repeated string store_ids = 1;
}

// Response for `CloseRecordings`, reporting what was actually closed.
message CloseRecordingsResponse {
  // The recordings that were closed, each as `{kind}:{application_id}:{recording_id}`.
  repeated string closed = 1;
}

// ----------------------------------------------------------------------------
// DescribeCommands

// Request for `DescribeCommands`.
message DescribeCommandsRequest {
  // Command ids, as `ListCommands` reports them.
  repeated string ids = 1;

  // Describe `recording` commands against this recording instead of the active one.
  optional string store_id = 2;

  // Describe `server` commands against this server instead of the selected one.
  optional string server_origin = 3;
}

// Response for `DescribeCommands`, in request order.
message DescribeCommandsResponse {
  // One per requested id.
  repeated ViewerCommand commands = 1;
}

// A command palette command.
message ViewerCommand {
  // Id for `RunCommand`.
  string id = 1;

  // Name shown in the palette.
  string title = 2;

  // What the command does.
  string description = 3;

  // What kind of thing it acts on: `"global"`, `"recording"`, `"server"`, or `"table"`.
  //
  // `target` names the specific one, e.g. scope `"recording"` with target
  // `Recording:my_app:1f2e…`, or scope `"server"` with target `rerun+http://127.0.0.1:51234`.
  string scope = 4;

  // Keyboard shortcuts as the viewer shows them, e.g. `⌘K`. Primary first.
  // Use these to tell the user how to run the command themselves.
  repeated string shortcuts = 5;

  // Whether `RunCommand` would run it now.
  bool available = 6;

  // Opens a native OS modal (e.g. a file dialog), which blocks the viewer (and this API) until a
  // person closes it.
  bool blocking_native_modal = 7;

  // Discards data, blueprint edits, a server, or the viewer itself.
  bool destructive = 8;

  // The specific thing within `scope` it would act on now: a store id, server origin, or table.
  // Absent for global commands, and when nothing in scope is available.
  optional string target = 9;
}

// ----------------------------------------------------------------------------
// EguiInspect

// Request for `EguiInspect`, wrapping one opaque `egui_inspection` request.
message EguiInspectRequest {
  // `egui_inspection` request.
  bytes request = 1;
}

// Response for `EguiInspect`, wrapping one opaque `egui_inspection` response.
message EguiInspectResponse {
  // `egui_inspection` response.
  bytes response = 1;
}

// ----------------------------------------------------------------------------
// GetBlueprint

// Request for `GetBlueprint`.
message GetBlueprintRequest {
  reserved 1;
  reserved "store_id";

  // Whose blueprint to read. Exactly one is set, like a Rust enum: there is no default target.
  oneof target {
    // Read the blueprint of a recording.
    RecordingBlueprintTarget recording = 2;

    // Read the blueprint of a table.
    TableBlueprintTarget table = 3;
  }
}

// The recording a `GetBlueprint` or `SetBlueprint` reads or writes the blueprint of.
//
// Blueprints belong to an application, so every recording of the same application shares one.
message RecordingBlueprintTarget {
  // The recording, as `{kind}:{application_id}:{recording_id}`. Defaults to the active recording.
  optional string store_id = 1;
}

// The table a `GetBlueprint` or `SetBlueprint` reads or writes the blueprint of.
message TableBlueprintTarget {
  // The table: a dataset or table `url` from `servers` in `GetViewerState`, or a server's
  // `origin` for its list of entries. Defaults to the table on screen.
  optional string table_url = 1;
}

// Response for `GetBlueprint`.
message GetBlueprintResponse {
  // The blueprint that was read.
  string blueprint_id = 1;

  // The whole blueprint as a JSON object, as `GetBlueprint` returns it.
  string json = 2;

  // The recording whose blueprint was read, set when the blueprint is a recording's.
  optional string store_id = 3;

  // The table whose blueprint was read, set when the blueprint is a table's. A table that only
  // exists in the viewer has no URL, so neither this nor `store_id` is set for it.
  optional string table_url = 4;
}

// ----------------------------------------------------------------------------
// GetTableSchema

// Request for `GetTableSchema`.
message GetTableSchemaRequest {
  // The table's URL: a dataset or table `url` from `servers` in `GetViewerState`, or a server's
  // `origin` for its list of entries. Defaults to the table on screen.
  optional string table_url = 1;
}

// Response for `GetTableSchema`.
message GetTableSchemaResponse {
  // Every column of the table, in display order, hidden ones included.
  repeated TableColumnSchema columns = 1;
}

// One column of a table.
message TableColumnSchema {
  // The Arrow field name, e.g. `rerun_segment_id`. Table blueprints use it in `column_order` at
  // `/table/layouts/table` and in `/table/layouts/table/columns/<name>`.
  string name = 1;

  // The header name: the blueprint's `TableColumn` `name`, or else derived from `name`.
  string display_name = 2;

  // Arrow datatype of the column, e.g. `Utf8`.
  string datatype = 3;
}

// ----------------------------------------------------------------------------
// GetDatasetSchema

// Request for `GetDatasetSchema`.
message GetDatasetSchemaRequest {
  // A dataset `url` from `servers` in `GetViewerState`. Defaults to the dataset on screen, or
  // the dataset of the segment on screen.
  optional string dataset_url = 1;

  // Only describe this entity and the entities below it, e.g. `/world/robot`. Omit for the whole
  // dataset.
  optional string entity_path = 2;

  // How many entities to describe at most.
  //
  // Defaults to 100, or to 10000 with `paths_only`.
  optional uint32 max_entities = 3;

  // Name the entities without describing what is logged on them.
  //
  // Defaults to true without an `entity_path` and to false with one. So a first call shows the
  // shape of the dataset, and a call with `entity_path` gives the components of the entities
  // that turned out to matter.
  optional bool paths_only = 4;
}

// Response for `GetDatasetSchema`: the dataset's entities and the components on them.
message GetDatasetSchemaResponse {
  // The names of the dataset's timelines.
  repeated string timelines = 1;

  // The matching entities in path order, each with the components logged on it.
  repeated RecordingEntitySchema entities = 2;

  // How many matching entities `max_entities` left out.
  //
  // Anything above zero means this answer describes only part of the dataset: narrow with
  // `entity_path`, or raise `max_entities`.
  uint32 omitted_entities = 3;
}

// ----------------------------------------------------------------------------
// GetRecordingSchema

// Request for `GetRecordingSchema`.
message GetRecordingSchemaRequest {
  // Recording to describe, as `{kind}:{application_id}:{recording_id}`. If omitted, the active
  // recording is used.
  optional string store_id = 1;

  // Only describe this entity and the entities below it, e.g. `/world/robot`. Omit for the whole
  // recording.
  //
  // A recording with more entities than one answer holds comes back truncated, and narrowing here
  // is how to read the rest of it.
  //
  // `NOT_FOUND` if nothing in the recording is at or below this path, since an empty answer would
  // otherwise read as "the recording has no such data" rather than "that path is not in it".
  optional string entity_path = 2;

  // How many entities to describe at most.
  //
  // Defaults to 100, or to 10000 with `paths_only`, since a path costs a line where the
  // components on it cost many.
  optional uint32 max_entities = 3;

  // Name the entities without describing what is logged on them.
  //
  // A whole recording's paths fit in one answer at a size worth reading, where its components
  // would not. Use this to see the shape of an unfamiliar recording, then call again with
  // `entity_path` for the components of the entities that turned out to matter.
  optional bool paths_only = 4;
}

// Response for `GetRecordingSchema`: the recording's entities and the components on them.
message GetRecordingSchemaResponse {
  // The recording described (resolved from the request, or the active recording), as
  // `{kind}:{application_id}:{recording_id}`.
  string store_id = 1;

  // The recording's timelines with their time ranges.
  //
  // Not affected by `entity_path` or `max_entities`: a timeline belongs to the recording, and a
  // component's time values only mean something against the timeline they were logged on.
  repeated ViewerTimeline timelines = 4;

  // The matching entities in path order, each with the components logged on it.
  //
  // With `paths_only` the components are left out, and an entity here names a path that has had
  // something logged on it, nothing more.
  repeated RecordingEntitySchema entities = 2;

  // How many matching entities `max_entities` left out.
  //
  // Anything above zero means this answer describes only part of the recording: narrow with
  // `entity_path`, or raise `max_entities`.
  uint32 omitted_entities = 3;
}

// One entity of a recording, with every component ever logged on it.
message RecordingEntitySchema {
  // The entity path, e.g. `/world/robot/joints`.
  string entity_path = 1;

  // The components logged on this entity.
  repeated RecordingComponentSchema components = 2;
}

// One component column of a recording.
message RecordingComponentSchema {
  // What the component is stored as, and what a query asks for, e.g. `Points3D:positions`.
  //
  // Unique within its entity. This, not `component_type`, is the name to pass along.
  string component = 1;

  // The archetype it was logged through, e.g. `rerun.archetypes.Points3D`.
  //
  // Absent if it was not logged through an archetype.
  optional string archetype = 2;

  // The semantic type of a value, e.g. `rerun.components.Position3D`.
  //
  // Absent if the data was logged without one. Two components of different archetypes share a
  // type when they mean the same thing, so this is what says a column is comparable to another.
  optional string component_type = 3;

  // Arrow datatype of a single value, e.g. `FixedSizeList(3 x non-null Float32)`.
  //
  // This is the type of one element of the component's list, not of the stored column.
  string datatype = 4;

  // Whether the component has ever been logged statically.
  //
  // A static value has no time of its own and answers every query, so `true` means the component
  // is readable at any point on any timeline. It does not mean the component is *only* static:
  // the same component may also carry temporal data, which takes precedence where it exists,
  // and this stays `true`. `false` does mean the component is temporal only.
  //
  // Always set, so a temporal-only component says `false` rather than saying nothing.
  optional bool has_static = 5;
}

// ----------------------------------------------------------------------------
// GetViewerLogs

// Request for `GetViewerLogs`.
message GetViewerLogsRequest {
  // Only return entries with a sequence number greater than this.
  // Omit for everything still buffered.
  optional uint64 after_sequence = 1;
}

// Response for `GetViewerLogs`: the buffered log entries, oldest first.
message GetViewerLogsResponse {
  // The matching entries. The viewer keeps a bounded buffer, so old entries drop out.
  repeated ViewerLogEntry entries = 1;
}

// One log message emitted by the viewer.
message ViewerLogEntry {
  // Increases by one per message. Pass the last seen value back as `after_sequence`.
  uint64 sequence = 1;

  // Log level: `"INFO"`, `"WARN"`, or `"ERROR"`.
  string level = 2;

  // The module that logged the message, starting with the crate name.
  string target = 3;

  // The log message.
  string message = 4;
}

// ----------------------------------------------------------------------------
// GetViewerState

// Request for `GetViewerState`. Empty: the whole state is always returned.
message GetViewerStateRequest {}

// Response for `GetViewerState`: a snapshot of what the viewer is currently showing.
message GetViewerStateResponse {
  // The current viewer page/route (e.g. which recording or hub page is shown).
  string url = 1;

  // The active recording, if any, as `{kind}:{application_id}:{recording_id}`.
  optional string active_store_id = 2;

  // Every open recording.
  repeated ViewerRecording recordings = 3;

  // Origin of the catalog server the viewer hosts, e.g. `rerun+http://127.0.0.1:9876`.
  //
  // Clients (notably `re_viewer_mcp`) hand this to the Python `CatalogClient` to read the data
  // behind the open recordings, which this service deliberately does not serve itself.
  // Unset if the viewer has no catalog, which on native is only the case before it starts up.
  optional string catalog_url = 4;

  // The views of the current blueprint, with the warnings and errors each one reports.
  repeated ViewerView views = 5;

  // Version of the viewer answering, e.g. `0.38.0-alpha.1`.
  //
  // Which Rerun this is decides which API and which docs apply, so clients would otherwise have
  // to shell out to `rerun --version` and hope they found the same binary.
  optional string viewer_version = 6;

  // What the viewer is still loading, empty once everything has arrived.
  //
  // `OpenUrl` returns as soon as the load starts, and a recording appears in `recordings` as
  // soon as its first message lands, so a recording with no timelines yet means "still arriving"
  // rather than "empty". Poll until this list is empty before concluding that a load finished,
  // and prefer that over a screenshot: a viewer busy importing does not paint frames, so the
  // UI tools stall while this one keeps answering.
  //
  // Sources that merely wait for someone else to send data — an SDK connection, a message proxy
  // — are not listed: they never finish, and the viewer is idle while they wait.
  repeated ViewerLoadingSource loading = 7;

  // The Redap servers listed in the viewer's left panel, with their catalog entries.
  //
  // Users name a server by its host or a nickname ("the EU stack"), so this is how a client maps
  // that name to a URL it can pass to `OpenUrl`.
  repeated ViewerServer servers = 8;
}

// A Redap server the viewer is connected to.
message ViewerServer {
  // The server's origin, as `rerun+https://<host>:<port>`.
  string origin = 1;

  // The server's catalog entries. Empty while the catalog is still loading, or if it failed.
  repeated ViewerServerEntry entries = 2;

  // Why the catalog could not be listed, e.g. a missing login.
  optional string error = 3;
}

// One catalog entry on a Redap server.
message ViewerServerEntry {
  // The entry's name, as shown in the left panel.
  string name = 1;

  // What kind of entry this is, as the server reports it.
  rerun.cloud.v1alpha1.EntryKind kind = 2;

  // URL that opens this entry, usable with `OpenUrl`.
  string url = 3;
}

// A data source the viewer is currently loading from.
message ViewerLoadingSource {
  // What is being loaded: a file path, a URL's display name, or a segment id.
  string name = 1;

  // The same thing the viewer's own loading screen says, e.g. `Loading /path/to/dataset…`.
  string status = 2;
}

// One view in the viewer's current blueprint.
message ViewerView {
  // The view id, usable with `SaveScreenshot`.
  string view_id = 1;

  // The view class, e.g. `3D`, `TimeSeries`.
  string class = 2;

  // The view's display name.
  string name = 3;

  // The entity path the view is rooted at.
  string origin = 4;

  // Whether the view is currently visible.
  bool visible = 5;

  // Warnings and errors the view and its visualizers reported the last time it was shown.
  repeated ViewerReport reports = 6;
}

// A warning or error from a view.
message ViewerReport {
  // `"warning"` or `"error"`.
  string severity = 1;

  // Short description.
  string summary = 2;

  // Longer explanation, if any.
  optional string details = 3;
}

// One open recording in the viewer.
message ViewerRecording {
  // Store id of the recording.
  //
  // `{kind}:{application_id}:{recording_id}`, e.g. `Recording:my_app:1830B33B45B963E7`. `kind` is
  // `Recording` or `Blueprint`. Both ids may contain a colon, so the application id's are escaped
  // as `\:` (and `\` as `\\`): the kind runs to the first colon, the application id to the next
  // unescaped one, and the recording id is the rest. Pass the whole string back wherever an
  // operation takes a recording.
  string store_id = 1;

  // The recording's timelines with their time ranges.
  repeated ViewerTimeline timelines = 2;

  // The recording's current time cursor.
  TimeCursor current_time = 3;
}

// A timeline of a recording, with its time range.
message ViewerTimeline {
  // The timeline this describes.
  rerun.common.v1alpha1.Timeline timeline = 1;

  // Timeline type, e.g. `"timestamp"`, `"duration"`, or `"sequence"`.
  rerun.common.v1alpha1.TimeType time_type = 2;

  // The inclusive range of time values present on this timeline. Absent if the timeline has no data yet.
  optional rerun.common.v1alpha1.TimeRange time_range = 3;
}

// ----------------------------------------------------------------------------
// HighlightRect

// Request for `HighlightRect`.
message HighlightRectRequest {
  // The rectangle to outline, in logical points from the top-left corner of the viewer — the
  // same coordinate frame `get_widget` reports a widget's `bounds` in, so those bounds can be
  // passed straight through.
  //
  // Omit it to dismiss the current highlight instead.
  optional ScreenRect rect = 1;

  // Short text shown beside the outline, naming what is being pointed at.
  optional string label = 2;
}

// A rectangle on the viewer's screen.
//
// In logical points from the top-left corner of the viewer window — the same coordinate frame
// `get_widget` reports a widget's `bounds` in, so those can be passed straight through.
message ScreenRect {
  // Distance from the left edge of the viewer to the left edge of the rectangle.
  float x = 1;

  // Distance from the top edge of the viewer to the top edge of the rectangle.
  float y = 2;

  // Width of the rectangle. Must be positive.
  float w = 3;

  // Height of the rectangle. Must be positive.
  float h = 4;
}

// Response for `HighlightRect`. Empty: an error is reported as a gRPC status instead.
message HighlightRectResponse {}

// ----------------------------------------------------------------------------
// ListCommands

// Request for `ListCommands`.
message ListCommandsRequest {
  // Include one-line descriptions.
  optional bool include_descriptions = 1;

  // Include commands that cannot run right now.
  optional bool include_unavailable = 2;

  // Check `recording` commands against this recording instead of the active one.
  optional string store_id = 3;

  // Check `server` commands against this server instead of the selected one.
  optional string server_origin = 4;
}

// Response for `ListCommands`, sorted by id.
message ListCommandsResponse {
  // The matching commands.
  repeated CommandSummary commands = 1;
}

// A command as `ListCommands` reports it.
message CommandSummary {
  // Id for `DescribeCommands` and `RunCommand`.
  string id = 1;

  // Only with `include_descriptions`.
  optional string description = 2;
}

// ----------------------------------------------------------------------------
// OpenUrl

// Request for `OpenUrl`.
message OpenUrlRequest {
  // The URL to open in the viewer. This can be a recording/blueprint file URL, a `rerun://`
  // dataset URI, a redap server/catalog URL, or an intra-recording link.
  string url = 1;
}

// Response for `OpenUrl`.
message OpenUrlResponse {
  // True if the initial load (see `OpenUrl`) was not done when the viewer answered.
  bool still_loading = 1;
}

// ----------------------------------------------------------------------------
// RunCommand

// Request for `RunCommand`.
message RunCommandRequest {
  // Command id, as `ListCommands` reports it.
  string id = 1;

  // Recording for a `recording` command. Defaults to the active one.
  optional string store_id = 2;

  // Server for a `server` command, e.g. `rerun+http://127.0.0.1:51234`. Defaults to the selected one.
  optional string server_origin = 3;

  // Allow a command that opens a native modal (see `ViewerCommand.blocking_native_modal`).
  optional bool allow_blocking_native_modal = 4;
}

// Response for `RunCommand`.
message RunCommandResponse {
  // The command that was queued, as `DescribeCommands` reports it.
  //
  // Its `shortcuts` tell the user how to do it themselves next time.
  ViewerCommand command = 1;
}

// ----------------------------------------------------------------------------
// SaveScreenshot

// Request for `SaveScreenshot`.
message SaveScreenshotRequest {
  // Optional view ID to screenshot. If omitted, screenshots the entire viewer.
  optional string view_id = 1;

  // Path at which the screenshot will be saved.
  // This path is relative to the current working directory of the viewer process.
  string file_path = 2;

  // Longest side of the saved image, in pixels. A larger screenshot is scaled down to fit,
  // keeping its aspect ratio. If omitted, the screenshot is saved at full resolution.
  optional uint32 max_size = 3;
}

// Response for `SaveScreenshot`. Empty: an error is reported as a gRPC status instead.
//
// The response is only sent once the screenshot has actually been written to disk.
message SaveScreenshotResponse {}

// ----------------------------------------------------------------------------
// CaptureProfileTrace

// Request for `CaptureProfileTrace`.
message CaptureProfileTraceRequest {
  // Path at which the `.puffin` file will be saved.
  // This path is relative to the current working directory of the viewer process.
  string file_path = 1;

  // How many frames to record, between 1 and 300. Defaults to 5.
  // Ask for more to average over steady work like playback.
  optional uint32 num_frames = 2;
}

// Response for `CaptureProfileTrace`.
//
// The response is only sent once the profile has actually been written to disk.
message CaptureProfileTraceResponse {
  // How many frames the file holds.
  uint32 num_frames = 1;

  // Absolute path of the written `.puffin` file.
  string file_path = 2;
}

// ----------------------------------------------------------------------------
// SetBlueprint

// Request for `SetBlueprint`.
message SetBlueprintRequest {
  reserved 1;
  reserved "store_id";

  // The whole blueprint as a JSON object, keyed by blueprint entity path, as `GetBlueprint`
  // returns it.
  string json = 2;

  // Whose blueprint to write. Exactly one is set, like a Rust enum: there is no default target.
  oneof target {
    // Write the blueprint of a recording.
    RecordingBlueprintTarget recording = 3;

    // Write the blueprint of a table.
    // Use this to customize tables, enable card layouts, and add preview cells.
    //
    // The entity paths and archetypes of a table blueprint are described by
    // `rerun.blueprint.archetypes.TableBlueprint` in the Python SDK and in
    // <https://rerun.io/docs/howto/visualization/configure-table-blueprints>.
    //
    // `TableBlueprint` at `/table` has these fields:
    // * `layout`: `Table` or `Cards`. When unset, cards show if `/table/layouts/cards` has a
    //   `CardLayout`, and the table shows otherwise. `Cards` without a `CardLayout` shows the table.
    // * `column_display_mode`: how column names show, `Compact`, `Component` or `Full`.
    //   Defaults to `Compact`.
    // * `filters`: SQL row filters, described below.
    //
    // Enum values in the JSON are the variant names, such as `"Cards"`. The Python SDK takes
    // lowercase strings instead, such as `default_layout="cards"`.
    //
    // This blueprint shows three columns first, renames one and hides another:
    //
    // ```json
    // {
    //   "/table/layouts/table": {"TableLayout": {"column_order": ["recording link", "property:my_props:my_score", "rerun_segment_id"]}},
    //   "/table/layouts/table/columns/property\\:my_props\\:my_score": {"TableColumn": {"name": "Score"}},
    //   "/table/layouts/table/columns/rerun_segment_id": {"TableColumn": {"visible": false}}
    // }
    // ```
    //
    // `column_order` takes plain column names. In a column's entity path, `:` and spaces are
    // escaped as `\:` and `\ `, so `recording link` becomes `columns/recording\ link`.
    //
    // This blueprint shows rows as cards, with a 3D view of `/my_scene` on each card, titled by
    // `my_title`:
    //
    // ```json
    // {
    //   "/table": {"TableBlueprint": {"layout": "Cards"}},
    //   "/table/layouts/cards": {"CardLayout": {"title": "my_title", "link": "recording link", "field_order": ["recording link", "my_title"]}},
    //   "/table/layouts/cards/fields/recording\\ link": {"TableColumn": {"cell_kind": "Preview"}, "TableColumnPreview": {"views": "/view/0f3c9a52-7d1e-4b8a-9c2f-1e5d6a7b8c9d"}},
    //   "/view/0f3c9a52-7d1e-4b8a-9c2f-1e5d6a7b8c9d": {"ViewBlueprint": {"class_identifier": "3D", "space_origin": "/my_scene"}},
    //   "/view/0f3c9a52-7d1e-4b8a-9c2f-1e5d6a7b8c9d/ViewContents": {"ViewContents": {"query": "+ /my_scene/**"}}
    // }
    // ```
    //
    // Card fields live under `fields/`, not `columns/`, and only the fields in `field_order`
    // show. Each preview view has its own UUID, in the form a recording blueprint writes views.
    //
    // Learn what the dataset holds with `GetDatasetSchema` before choosing a preview. Then ask the
    // user what the preview shows, and suggest what tells the segments apart at a glance, such as
    // a moving robot model, a trajectory, or a video. To refine a preview, inspect the recordings
    // it loads rather than opening a segment.
    // Each card's recording shows in `recordings` of `GetViewerState`, with the dataset id as its
    // application id and the segment id as its recording id, and works with `GetRecordingSchema`.
    // Every visible card renders its own recording, which is costly, so keep previews small: few
    // views, and only the entities that matter.
    //
    // Row filters are SQL expressions in `filters` of `TableBlueprint` at `/table`, such as
    // `"my_column" ILIKE '%text%'`. Its docs list the forms the filter bar shows as editable widgets.
    // Users cannot write SQL in the viewer. They only add those forms from a column header's menu,
    // and can only remove any other filter.
    TableBlueprintTarget table = 4;
  }
}

// Response for `SetBlueprint`.
message SetBlueprintResponse {
  // The blueprint that was written.
  string blueprint_id = 1;

  // The recording whose blueprint was written, set when the blueprint is a recording's.
  optional string store_id = 2;

  // The table whose blueprint was written, set when the blueprint is a table's. A table that
  // only exists in the viewer has no URL, so neither this nor `store_id` is set for it.
  optional string table_url = 3;
}

// ----------------------------------------------------------------------------
// SetTimeCursor

// Request for `SetTimeCursor`.
message SetTimeCursorRequest {
  // Recording to seek, as `{kind}:{application_id}:{recording_id}`. If omitted, the active
  // recording is used.
  optional string store_id = 1;

  // Timeline to seek on. If omitted, the active timeline is used.
  optional common.v1alpha1.Timeline timeline = 2;

  // Time value to seek to: a sequence index for sequence timelines, or nanoseconds for
  // temporal timelines (see `GetViewerState` for each timeline's type and range).
  rerun.common.v1alpha1.TimelineTime time = 3;

  // If true, start playing the recording from the new position. Omit it, or pass false, to
  // pause the recording instead.
  optional bool play = 4;
}

// Response for `SetTimeCursor`, echoing back what the request resolved to.
message SetTimeCursorResponse {
  // The recording the cursor was moved in (resolved from the request, or the active recording),
  // as `{kind}:{application_id}:{recording_id}`.
  string store_id = 1;

  // The timeline the cursor was moved on (resolved from the request, or the active/first timeline).
  rerun.common.v1alpha1.Timeline timeline = 2;

  // Timeline type, e.g. `"timestamp"`, `"duration"`, or `"sequence"`.
  rerun.common.v1alpha1.TimeType time_type = 3;

  // The time the cursor was moved to.
  rerun.common.v1alpha1.TimelineTime time = 4;
}

// A position on a timeline.
message TimeCursor {
  // The timeline the cursor sits on.
  rerun.common.v1alpha1.Timeline timeline = 1;

  // Timeline type. May be absent if the recording is still loading.
  optional rerun.common.v1alpha1.TimeType time_type = 2;

  // Current time on the timeline. Absent if the cursor is not set.
  optional rerun.common.v1alpha1.TimelineTime time = 3;
}
