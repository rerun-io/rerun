// Request for `GetTableSchema`.
message GetTableSchemaRequest {
  // Deprecated: use x-rerun-entry-id header instead.
  // This field should be dropped once all servers are updated
  // to 0.14.x or later.
  rerun.common.v1alpha1.EntryId table_id = 1;
}

// Response for `GetTableSchema`.
message GetTableSchemaResponse {
  // Schema of the table.
  rerun.common.v1alpha1.Schema schema = 1;
}

// Request for `ScanTable`.
message ScanTableRequest {
  // Deprecated: use x-rerun-entry-id header instead.
  // This field should be dropped once all servers are updated
  // to 0.14.x or later.
  rerun.common.v1alpha1.EntryId table_id = 1;

  // TODO(jleibs): support ScanParameters iff we can plumb them into Datafusion TableProvider
  // Otherwise, just wait for Arrow Flight
  //rerun.common.v1alpha1.ScanParameters scan_parameters = 2;
}

// One batch of the table's contents, yielded by `ScanTable`.
message ScanTableResponse {
  // A consecutive run of the table's rows: the batches of one stream partition the rows, and
  // concatenating them in arrival order yields the full scan result. The row order itself is
  // only meaningful when the scan asked for one.
  rerun.common.v1alpha1.DataframePart dataframe_part = 1;
}

// How `WriteTable` folds new rows into an existing table.
enum TableInsertMode {
  // Always reserve unspecified as default value
  TABLE_INSERT_MODE_UNSPECIFIED = 0;

  // Appends new rows to the existing table without modifying any existing rows.
  TABLE_INSERT_MODE_APPEND = 1;

  // Overwrites all existing rows in the table with the new rows.
  TABLE_INSERT_MODE_OVERWRITE = 2;

  // Overwrite rows based on the rerun_table_index fields.
  TABLE_INSERT_MODE_REPLACE = 3;

  // Update existing rows matched by rerun_table_index fields. Source rows that
  // do not match any existing row are dropped. The source schema may be a
  // subset of the table schema (only the key columns plus the columns to
  // update). Maps to SQL `UPDATE`.
  TABLE_INSERT_MODE_UPDATE = 4;
}

// One batch of rows pushed by `WriteTable`.
message WriteTableRequest {
  // The rows to write.
  rerun.common.v1alpha1.DataframePart dataframe_part = 1;

  // How to fold these rows into the existing table.
  TableInsertMode insert_mode = 2;
}

// Response for `WriteTable`. Empty: an error is reported as a gRPC status instead.
message WriteTableResponse {}

// --- Maintenance ---

// Request for `DoMaintenance`.
//
// Each field turns on one operation; no operation is on by default, so a request with every
// field unset performs no maintenance and returns an empty report. (It may still do trivial
// internal bookkeeping, such as creating the dataset's revision row on first contact.)
//
// `DoGlobalMaintenance` does not reuse these defaults: it constructs an explicit request per
// dataset (index optimization, fragment compaction, and an age-bounded cleanup).
message DoMaintenanceRequest {
  // Optimize all builtin indexes on this dataset.
  //
  // This merges all individual index deltas back in the main index, improving runtime performance
  // of all indexes.
  bool optimize_indexes = 2;

  // Fully consolidate every index on this dataset, ignoring the server's segment-count
  // threshold that normally bounds how often indexes are merged.
  //
  // This is the manual drain hammer for accumulated index segments and deferred index-remap
  // (fragment-reuse) debt. Implies `optimize_indexes`.
  //
  // Historically this retrained user-defined vector indexes; those are gone, and the remaining
  // builtin scalar indexes have no trained state — a retrain is exactly a full consolidation.
  bool retrain_indexes = 6;

  // Compact the underlying Lance fragments, for all Rerun Manifests.
  //
  // Hardcoded to the default (optimal) settings.
  bool compact_fragments = 3;

  // If set, all Lance fragments older than this date will be removed, for all Rerun Manifests.
  //
  // In case requested date is more recent than 1 hour, it will be ignored and 1 hour ago
  // timestamp will be used. This is to prevent still used files (like recent transaction files)
  // to be removed and cause Lance Dataset update issues.
  //
  // See https://docs.rs/lance/latest/lance/dataset/cleanup/index.html
  // and https://docs.rs/lance/latest/lance/dataset/cleanup/fn.cleanup_old_versions.html
  google.protobuf.Timestamp cleanup_before = 4;

  // List the replicated dataset in its object store, such as S3, and remove objects that are no
  // longer present in the local dataset.
  // This performs a full remote reconciliation, unlike normal cleanup, which only removes replica
  // objects corresponding to local files deleted during that cleanup.
  bool gc_object_store = 7;

  // Override default platform behavior and allow cleanup of recent files. This will respect
  // the value of `cleanup_before` timestamp even if it's more recent than 1 hour.
  //
  // ⚠️ Do not ever use this unless you know exactly what you're doing. Improper use will lead to data loss.
  bool unsafe_allow_recent_cleanup = 5;

  reserved 1;
  reserved "dataset_id";
}

// Response for `DoMaintenance`.
message DoMaintenanceResponse {
  // Human-readable report of what the requested operations did.
  string report = 1;
}

// Request all maintenance operations to run on all datasets
message DoGlobalMaintenanceRequest {}

// Response for `DoGlobalMaintenance`. Empty: an error is reported as a gRPC status instead.
message DoGlobalMaintenanceResponse {}

