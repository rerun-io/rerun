// The catalog server public API.
//
// This is the entire public gRPC surface a client (SDK, viewer, or CLI) uses to talk to a catalog
// server. It covers the catalog itself (datasets and tables), reading and writing the manifest
// registry, Rerun-native queries and chunk fetching, table access, task management and
// maintenance.
//
// Everything in here is public and versioned. The private endpoints that back it live in
// `redap/v1alpha1/`.

syntax = "proto3";

package rerun.cloud.v1alpha1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "rerun/v1alpha1/common.proto";
import "rerun/v1alpha1/log_msg.proto";

// The catalog server public API.
//
// ## Headers
//
// Most endpoints in the catalog server service require specific gRPC headers to be set.
//
// The so-called "standard dataset headers" correspond to at least one of the following headers:
// * x-rerun-entry-id: ID of the entry of interest, e.g. `1860390B087BC65F602d68eb646c385c`.
// * x-rerun-entry-name-bin: Name of the entry of interest, e.g. `droid:sample2k`.
//
// Headers with a -bin suffix must be base64-encoded (HTTP only supports ASCII values, UTF8 strings must
// binary encoded).
//
// Some entry-addressed endpoints also accept the entry id in a deprecated body field. Every server
// resolves those the same way: the `x-rerun-entry-id` header wins, the body field is a fallback for
// old clients, and both unset fails with `INVALID_ARGUMENT` (a gRPC status code). If both are set
// but disagree, the call fails with `INVALID_ARGUMENT` naming the two ids, rather than silently
// picking one. `x-rerun-entry-name-bin` is never resolved on these endpoints.
service RerunCloudService {
  // Returns version and build information about the server.
  //
  // Also reports the optional features this server supports, so clients can stay safe against
  // rolling deployments where the server is older than the client
  // (see `ConnectionClient::supports_feature`).
  rpc Version(VersionRequest) returns (VersionResponse) {}

  // Returns information about the currently authenticated user.
  //
  // This is a lightweight endpoint that can be used to verify that authentication
  // is successful and to retrieve the user's identity.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {}

  // Returns a payload of pseudo-random (incompressible) bytes of the requested size.
  //
  // Intended for measuring round-trip time and bandwidth between client and server:
  // * Send a few small requests (e.g. `num_bytes = 1`) to estimate RTT.
  // * Send a larger request (e.g. `num_bytes = 1 MiB`), subtract the RTT, and divide
  //   `num_bytes` by the remaining time to estimate bandwidth.
  //
  // The response is streamed as one or more chunks; the total number of bytes across
  // all chunks is exactly `num_bytes`.
  rpc DoBandwidthTest(DoBandwidthTestRequest) returns (stream DoBandwidthTestResponse) {}

  // --- Catalog ---

  // Subscribe to catalog events as they happen.
  //
  // The stream yields one response per event and stays open until the client drops it.
  // Events are emitted for entry creation (datasets and tables) and entry deletion. Renames
  // produce no event, and neither do implicitly created blueprint or asset datasets.
  //
  // Servers may not support this at all: a server without event support returns
  // `UNIMPLEMENTED`, and clients must treat that as permanent rather than retrying.
  // Rerun Hub currently returns `UNIMPLEMENTED` (RR-4859).
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse) {}

  // List the entries of the catalog that match the given filter.
  rpc FindEntries(FindEntriesRequest) returns (FindEntriesResponse) {}

  // Mark an entry as deleted, making it unavailable for future use.
  //
  // Deleting a dataset or table also deletes the blueprint and asset datasets it owns, and
  // frees its name for immediate reuse. Whether the underlying data is removed right away is
  // server-defined: Rerun Hub soft-deletes and reclaims storage in a later
  // garbage-collection pass, while the OSS server deletes synchronously.
  //
  // The entry is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `id` field (see the `Headers` section at the top of this file).
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteEntryResponse) {}

  // Update the kind-agnostic details of an entry, i.e. its name.
  //
  // Fails with `ALREADY_EXISTS` if the new name is taken. A rename to the current name is a
  // no-op.
  //
  // The entry is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `id` field (see the `Headers` section at the top of this file).
  rpc UpdateEntry(UpdateEntryRequest) returns (UpdateEntryResponse) {}

  // Create a new dataset entry, with no segments.
  //
  // A blueprint dataset and an asset dataset are created alongside it and referenced from the
  // returned `dataset_details`; both are owned by the entry and cascade on delete. The request
  // may carry a caller-chosen `id`; otherwise the server allocates one.
  //
  // Fails with `ALREADY_EXISTS` if an entry with the same name (or the same id) already
  // exists.
  rpc CreateDatasetEntry(CreateDatasetEntryRequest) returns (CreateDatasetEntryResponse) {}

  // Create a new table entry with the given schema.
  //
  // Backed by a fresh Lance table at a server-chosen URL. Naming your own storage URL via
  // `provider_details` is not supported on Rerun Hub (`UNIMPLEMENTED`); the OSS
  // server honors it. Fails with `FAILED_PRECONDITION` if the server has no table storage
  // configured, and with `ALREADY_EXISTS` if an entry with the same name already exists.
  //
  // Use `RegisterTable` instead to adopt a table that already exists.
  rpc CreateTableEntry(CreateTableEntryRequest) returns (CreateTableEntryResponse) {}

  // Fetch metadata about a specific dataset.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc ReadDatasetEntry(ReadDatasetEntryRequest) returns (ReadDatasetEntryResponse) {}

  // Overwrite the dataset-specific details of a dataset entry, e.g. its associated blueprint dataset.
  //
  // This is a full replace, not a merge: any field left unset in `dataset_details` is cleared.
  // [`blueprint_dataset`] and [`asset_dataset`] deliberately differ on that point; see their
  // own docs.
  //
  // [`blueprint_dataset`]: crate::cloud::v1alpha1::DatasetDetails::blueprint_dataset
  // [`asset_dataset`]: crate::cloud::v1alpha1::DatasetDetails::asset_dataset
  //
  // The dataset is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `id` field (see the `Headers` section at the top of this file).
  rpc UpdateDatasetEntry(UpdateDatasetEntryRequest) returns (UpdateDatasetEntryResponse) {}

  // Fetch metadata about a specific table.
  //
  // The table is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `id` field (see the `Headers` section at the top of this file).
  // Fails with the gRPC status code `NOT_FOUND` for unknown or soft-deleted entries.
  rpc ReadTableEntry(ReadTableEntryRequest) returns (ReadTableEntryResponse) {}

  // Overwrite the table-specific details of a table entry, e.g. its associated blueprint dataset.
  //
  // This is a full replace, not a merge: any field left unset in `table_details` is cleared,
  // except `blueprint_dataset`, which cannot be cleared: the server makes sure the table keeps
  // a blueprint dataset.
  //
  // The table is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `id` field (see the `Headers` section at the top of this file).
  rpc UpdateTableEntry(UpdateTableEntryRequest) returns (UpdateTableEntryResponse) {}

  // --- Manifest Registry ---

  /* Write data */

  // Register new segments with the Dataset.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc RegisterWithDataset(RegisterWithDatasetRequest) returns (RegisterWithDatasetResponse) {}

  // Unregisters segments and layers from the Dataset.
  //
  // This is an asynchronous operation, and returns a list of task ids.
  // The response is a stream only for historical reasons.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc UnregisterFromDataset(UnregisterFromDatasetRequest) returns (stream UnregisterFromDatasetResponse) {}

  // Write chunks to one or more segments.
  //
  // The segment ID for each individual chunk is extracted from their metadata (`rerun:segment_id`).
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc WriteChunks(stream WriteChunksRequest) returns (WriteChunksResponse) {}

  /* Query schemas */

  // Returns the schema of the segment table.
  //
  // This is not to be confused with the schema of the dataset itself. For that, refer to `GetDatasetSchema`.
  //
  // To inspect the data of the segment table, which is guaranteed to match the schema returned by
  // this endpoint, check out `ScanSegmentTable`.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc GetSegmentTableSchema(GetSegmentTableSchemaRequest) returns (GetSegmentTableSchemaResponse) {}

  // Inspect the contents of the segment table.
  //
  // The data will follow the schema returned by `GetSegmentTableSchema`.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc ScanSegmentTable(ScanSegmentTableRequest) returns (stream ScanSegmentTableResponse) {}

  // Returns the schema of the dataset manifest.
  //
  // To inspect the data of the dataset manifest, which is guaranteed to match the schema returned by
  // this endpoint, check out `ScanDatasetManifest`.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc GetDatasetManifestSchema(GetDatasetManifestSchemaRequest) returns (GetDatasetManifestSchemaResponse) {}

  // Inspect the contents of the dataset manifest.
  //
  // The data will follow the schema returned by `GetDatasetManifestSchema`.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc ScanDatasetManifest(ScanDatasetManifestRequest) returns (stream ScanDatasetManifestResponse) {}

  // Returns the schema of the dataset.
  //
  // This is the union of all the schemas from all the underlying segments. It will contain all the indexes,
  // entities and components present in the dataset.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc GetDatasetSchema(GetDatasetSchemaRequest) returns (GetDatasetSchemaResponse) {}

  // Get the RRD Footer manifest.
  //
  // This includes details about what chunks there are, and what kind of data they contain.
  //
  // The manifest might be returned in multiple parts, at the discretion of the server.
  // When that happens, it is guaranteed that all parts have the same exact Sorbet schemas (and therefore
  // identical Sorbet schema hashes too).
  // That means it is always semantically valid to concatenate the data from these RRD manifests.
  //
  // If the client sets `generate_direct_urls`, the server may instead return keys pointing at
  // encoded `rerun.log_msg.v1alpha1.RrdFooter` payloads for the client to fetch and decode.
  // This is best-effort: the response may still inline the manifests: clients must handle both forms.
  // However, all the items in a stream will either send inline manifest or urls, uniformly.
  rpc GetRrdManifest(GetRrdManifestRequest) returns (stream GetRrdManifestResponse) {}

  // Get the assets that apply to this dataset.
  //
  // Returns the dataset's asset dataset and the asset segments within it.
  // The asset segment ids may be spread over multiple responses, at the discretion of the server.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc GetAssetsForSegment(GetAssetsForSegmentRequest) returns (stream GetAssetsForSegmentResponse) {}

  /* Indexing */

  // Reserved (removed): the custom-index / vector-search subsystem was removed.
  // Do not reuse these RPC names: CreateIndex, ListIndexes, DeleteIndexes, SearchDataset.

  /* Queries */

  // Perform Rerun-native queries on a dataset, returning the matching chunk IDs, as well
  // as information that can be sent back to the catalog server to fetch the actual chunks as part
  // of `FetchChunks` request. In this 2-step query process, 1st step is getting information
  // from the server about the chunks that contain relevant information. 2nd step is fetching
  // those chunks (the actual data).
  //
  // These Rerun-native queries include:
  // * Filtering by specific segment and chunk IDs.
  // * Latest-at, range and dataframe queries.
  // * Arbitrary Lance filters.
  //
  // To fetch the actual chunks themselves, see `FetchChunks`.
  //
  // Passing chunk IDs to this method effectively acts as a IF_EXIST filter.
  //
  // For latest-at queries, the returned chunks are a **correctness-preserving
  // superset** of the minimum set needed to answer the query: the server may
  // include additional candidate chunks (e.g., overlap siblings within the
  // global max chunk length, or chunks that pass segment-level bounds without
  // per-value narrowing). Clients are expected to run their own latest-at
  // resolution on the returned chunks.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc QueryDataset(QueryDatasetRequest) returns (stream QueryDatasetResponse) {}

  // Fetch specific chunks from the catalog server. In a 2-step query process, result of 1st phase,
  // that is, the result of `QueryDataset` should include all the necessary information to send
  // the actual chunk requests, which is the 2nd step of the query process.
  //
  // See `FetchChunksRequest` for details on the fields that describe each individual chunk.
  rpc FetchChunks(FetchChunksRequest) returns (stream FetchChunksResponse) {}

  // --- Tables ---
  // TODO(jleibs): This will be replaced / extended by Arrow Flight

  // Register a foreign table as a new table entry in the catalog.
  rpc RegisterTable(RegisterTableRequest) returns (RegisterTableResponse) {}

  // Returns the schema of a table entry.
  //
  // The table is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `table_id` field (see the `Headers` section at the top of this file).
  rpc GetTableSchema(GetTableSchemaRequest) returns (GetTableSchemaResponse) {}

  // Inspect the contents of a table entry.
  //
  // The data follows the schema returned by `GetTableSchema`, assuming no concurrent write
  // changed the table in between.
  //
  // The table is identified by the `x-rerun-entry-id` header, falling back to the deprecated
  // body `table_id` field (see the `Headers` section at the top of this file).
  rpc ScanTable(ScanTableRequest) returns (stream ScanTableResponse) {}

  // Write record batches to a table.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  //
  // TODO(#11645): endpoints with streaming input are not supported by `grpc-web`.
  // A non-streaming shim will need to be added if/when the viewer uses this endpoint.
  rpc WriteTable(stream WriteTableRequest) returns (WriteTableResponse) {}

  // --- Tasks ---

  // Query the status of submitted tasks
  rpc QueryTasks(QueryTasksRequest) returns (QueryTasksResponse) {}

  // Query the status of submitted tasks as soon as they are no longer pending
  rpc QueryTasksOnCompletion(QueryTasksOnCompletionRequest) returns (stream QueryTasksOnCompletionResponse) {}

  // Cancel existing tasks
  rpc CancelTasks(CancelTasksRequest) returns (CancelTasksResponse);

  // --- Utilities ---

  // Rerun Manifests maintenance operations: scalar index creation, compaction, etc.
  //
  // This endpoint requires the standard dataset headers (see the `Headers` section at the top of this file).
  rpc DoMaintenance(DoMaintenanceRequest) returns (DoMaintenanceResponse) {}

  // Run global maintenance operations on the platform: this includes optimization
  // of all datasets, garbage collection of unused data, and can include more in the future.
  rpc DoGlobalMaintenance(DoGlobalMaintenanceRequest) returns (DoGlobalMaintenanceResponse) {}
}

// ---

// Request for `Version`. Empty: the whole version report is always returned.
message VersionRequest {}

// Response for `Version`.
message VersionResponse {
  // Detailed build information for the server binary.
  rerun.common.v1alpha1.BuildInfo build_info = 1;

  // A single version string representing the version of the whole stack.
  string version = 2;

  // Cloud provider hosting this instance (e.g. "aws", "azure"). Null if not deployed on cloud.
  optional string cloud_provider = 3;

  // Cloud region where this instance is deployed (e.g. "us-west-2", "eastus"). Null if not deployed on cloud.
  optional string cloud_region = 4;

  // Server-supported feature flags. Clients use this to gate optional behavior
  // and stay safe against rolling deployments where the server may be older
  // than the client.
  //
  // The format is a list of opaque feature strings. Known features:
  //
  // * `per_segment_index_values` — the server consumes
  //   `QueryLatestAt.per_segment_values` (RR-4355). Clients that omit this
  //   capability check and send `per_segment_values` to an old server will
  //   silently get static-only data.
  //
  // Unknown features must be ignored. Adding new features is additive and
  // never breaks compatibility — old clients see an empty list and fall back
  // to today's slow-but-correct path.
  repeated string features = 5;
}

// Capability names describing what a server implements and supports.
//
// A capability does not depend on the caller. Whether the caller is allowed to
// use one is answered by `can_read` and `can_write`.
//
// A name is lowercase segments separated by `:`, most general segment first, so
// a client can query a whole group by prefix. A server advertises full names
// only, never a prefix and never a `*`. Clients ignore names they do not know,
// so a new name never breaks an older client.
message ServerCapabilities {
  // Every capability this server implements and supports.
  repeated string capabilities = 1;
}

// Request for `WhoAmI`. Empty: the caller is identified by their credentials.
message WhoAmIRequest {}

// Response for `WhoAmI`.
message WhoAmIResponse {
  // The user ID of the authenticated user, if any.
  optional string user_id = 1;

  // Whether the user has read access.
  bool can_read = 2;

  // Whether the user has write access.
  bool can_write = 3;

  // What this server implements and supports, for any caller.
  //
  // Always set, empty when the server advertises none. Only a server from
  // before capabilities existed leaves it unset, which is not the same as
  // advertising none. Clients must tell the two apart, and send the request
  // anyway rather than treat everything as unsupported.
  optional ServerCapabilities capabilities = 4;
}

// Request for `DoBandwidthTest`.
message DoBandwidthTestRequest {
  // Total number of pseudo-random (incompressible) bytes the server should return,
  // summed across all streamed response chunks.
  uint64 num_bytes = 1;
}

// One chunk of the payload yielded by `DoBandwidthTest`.
message DoBandwidthTestResponse {
  // A chunk of pseudo-random (incompressible) bytes.
  //
  // The total length across all streamed chunks equals `DoBandwidthTestRequest.num_bytes`.
  bytes payload = 1;
}

// WatchEvents

// Request for `WatchEvents`.
message WatchEventsRequest {
  // Which kinds of events to subscribe to.
  //
  // If empty, the server subscribes to all event kinds.
  repeated EventKind kinds = 1;
}

// Selects a category of events to subscribe to in `WatchEvents`.
message EventKind {
  // Which category of events this selects.
  oneof kind {
    // Catalog entry lifecycle events (created, deleted).
    EntryEvents entry = 1;

    // TODO(RR-4853): RegistrationEvents registration = 2;
  }
}

// Subscribe to all catalog entry lifecycle events.
message EntryEvents {}

// One event yielded by `WatchEvents`.
message WatchEventsResponse {
  // Which event this is.
  oneof kind {
    // A catalog entry was created.
    EntryCreatedEvent entry_created = 1;

    // A catalog entry was deleted.
    EntryDeletedEvent entry_deleted = 2;

    // TODO(RR-4853): Add register events here too.
  }
}

// A catalog entry was created.
message EntryCreatedEvent {
  // The entry that was created.
  rerun.common.v1alpha1.EntryId id = 1;
}

// A catalog entry was deleted.
message EntryDeletedEvent {
  // The entry that was deleted.
  rerun.common.v1alpha1.EntryId id = 1;
}

// Application level error - used as `details` in the `google.rpc.Status` message
message Error {
  // error code
  ErrorCode code = 1;

  // unique identifier associated with the request (e.g. recording id, recording storage url)
  string id = 2;

  // human readable details about the error
  string message = 3;
}

// Error codes for application level errors
enum ErrorCode {
  // unused
  ERROR_CODE_UNSPECIFIED = 0;

  // object store access error
  ERROR_CODE_OBJECT_STORE_ERROR = 1;

  // metadata database access error
  ERROR_CODE_METADATA_DB_ERROR = 2;

  // Encoding / decoding error
  ERROR_CODE_CODEC_ERROR = 3;
}

// --- Manifest Registry ---

/* Write data */

// One place to read data from when registering it with a dataset.
message DataSource {
  // Where is the data for this data source stored (e.g. s3://bucket/file or file:///path/to/file)?
  optional string storage_url = 1;

  // Which segment layer should this data source be registered to?
  //
  // Defaults to `base` if unspecified.
  optional string layer = 3;

  // Is this a prefix URL (a directory)?
  // If true, all files of `typ` under this prefix will be
  // considered part of this data source.
  bool prefix = 4;

  // What kind of data is it (e.g. rrd, mcap, Lance, etc)?
  DataSourceKind typ = 2;

  // Removed experimental field.
  reserved 5;
  reserved "layer_class";
}

// What format the data behind a `DataSource` is stored in.
enum DataSourceKind {
  // Always reserve unspecified as default value.
  DATA_SOURCE_KIND_UNSPECIFIED = 0;

  // A Rerun recording (`.rrd`).
  DATA_SOURCE_KIND_RRD = 1;
}

// Request for `RegisterWithDataset`.
message RegisterWithDatasetRequest {
  // The data sources to register as segments of the dataset.
  repeated DataSource data_sources = 2;

  // What to do about a data source that is already registered with this dataset.
  rerun.common.v1alpha1.IfDuplicateBehavior on_duplicate = 3;

  reserved 1;
  reserved "dataset_id";
}

// Response for `RegisterWithDataset`.
message RegisterWithDatasetResponse {
  // One row per registered `(segment, layer)` pair, with the non-null `Utf8` columns
  // `rerun_segment_id`, `rerun_segment_layer`, `rerun_segment_type`, `rerun_storage_url`, and
  // `rerun_task_id`, in that order (pinned by
  // [`RegisterWithDatasetDataframe`](crate::cloud::v1alpha1::ext::RegisterWithDatasetDataframe)).
  //
  // Several rows can share a `rerun_task_id`: one registration task covers a whole batch. Data
  // sources that resolve to the same segment ID collapse into a single row, so the row count
  // is not necessarily `len(data_sources)`, and it is zero if every data source was skipped
  // (`IF_DUPLICATE_BEHAVIOR_SKIP`). Servers that register synchronously report a sentinel task
  // ID that is always "successful".
  rerun.common.v1alpha1.DataframePart data = 1;
}

// This request acts as a *product* filter:
// * empty `segments_to_drop` + empty `layers_to_drop`: invalid argument error
// * empty `segments_to_drop` + non-empty `layers_to_drop`: remove specified layers for *all* segments
// * non-empty `segments_to_drop` + empty `layers_to_drop`: remove *all* layers for specified segments
// * non-empty `segments_to_drop` + non-empty `layers_to_drop`: delete *all* specified layers for *all* specified segments
message UnregisterFromDatasetRequest {
  // The segment IDs to drop. All of them if empty.
  //
  // The final filter will be the *outer product* of this and `layers_to_drop`.
  repeated rerun.common.v1alpha1.SegmentId segments_to_drop = 1;

  // The layer names to drop. All of them if empty.
  //
  // The final filter will be the *outer product* of this and `segments_to_drop`.
  repeated string layers_to_drop = 2;

  // If true, deletion will go through regardless of the segments/layers' current statuses.
  //
  // This is only useful in the very specific, catatrophic scenario where the contents of the
  // task queue were lost and some tasks are now stuck in `status=pending` forever.
  //
  // Do not use this unless you know exactly what you're doing.
  bool force = 3;
}

// Response for `UnregisterFromDataset`.
message UnregisterFromDatasetResponse {
  // This dataframe is always empty. It remains here for format compatibility with older SDKs.
  // TODO(ilya): remove this once the clients are all new enough
  rerun.common.v1alpha1.DataframePart data = 1;

  // Id of the task that performs the unregistration. The data is not deleted until the task completes.
  rerun.common.v1alpha1.TaskId task_id = 2;
}

// One chunk pushed by `WriteChunks`.
message WriteChunksRequest {
  // The chunk to write. Its target segment comes from the chunk's own schema-level
  // `rerun:segment_id` metadata (legacy alias: `rerun:partition_id`); a chunk without it is
  // rejected with `INVALID_ARGUMENT`. Chunks are always written to the `base` layer.
  //
  // Not all servers implement `WriteChunks`; Rerun Hub currently returns
  // `UNIMPLEMENTED`.
  rerun.common.v1alpha1.RerunChunk chunk = 1;
}

// Response for `WriteChunks`. Empty: an error is reported as a gRPC status instead.
message WriteChunksResponse {}

/* Query schemas */

// Request for `GetSegmentTableSchema`.
//
// Empty: the dataset is identified by the standard dataset headers (see the `Headers` section at the top of this file).
message GetSegmentTableSchemaRequest {}

// Response for `GetSegmentTableSchema`.
message GetSegmentTableSchemaResponse {
  // Schema of the segment table.
  rerun.common.v1alpha1.Schema schema = 1;
}

// A plain list of segment IDs.
message SegmentIdList {
  // The segment IDs.
  repeated string segment_ids = 1;
}

// Narrows a manifest scan down to, or away from, a set of segments.
message SegmentIdFilter {
  // Whether the listed segments are the ones to keep or the ones to drop.
  oneof strategy {
    // Scan only manifest rows belonging to these segment IDs.
    // An empty list scans no segment rows.
    SegmentIdList scan_only = 1;

    // Scan all manifest rows except those belonging to these segment IDs.
    // An empty list skips no segment rows.
    SegmentIdList skip = 2;
  }
}

// Request for `ScanSegmentTable`.
//
// The dataset is identified by the standard dataset headers (see the `Headers` section at the top of this file).
message ScanSegmentTableRequest {
  reserved 2;
  reserved "sql_filter";

  // A list of column names to be projected server-side.
  //
  // If empty, all columns are returned.
  //
  // If not empty, the returned `RecordBatch` are guaranteed to only have the requested column, in the order they were
  // requested.
  //
  // If a projected column does not exist, or is projected more than once, the `ScanSegmentTable` call will fail with
  // an `InvalidArgument` error.
  repeated string columns = 1;

  // An optional best-effort hint for pruning segment IDs from the server-side scan.
  //
  // Servers may apply or ignore this filter.
  // Clients must re-apply filters locally if correctness depends on them.
  SegmentIdFilter segment_id_filter = 3;
}

// One batch of the segment table.
message ScanSegmentTableResponse {
  // Segments metadata as Arrow RecordBatch, with the columns pinned by
  // [`ScanSegmentTableDataframe`](crate::cloud::v1alpha1::ext::ScanSegmentTableDataframe).
  rerun.common.v1alpha1.DataframePart data = 1;
