  optional string name = 2;

  // Deprecated: use `entry_kinds` instead. Ignored by servers when `entry_kinds` is non-empty.
  optional EntryKind entry_kind = 3;

  // The entry kinds to include. If non-empty, the server returns exactly entries of these kinds
  // (ENTRY_KIND_UNSPECIFIED is rejected with an `invalid_argument` error).
  //
  // It is recommended to always explicitly ask for a set of entry kinds.
  // When unset the server returns a default set of kinds to ensure backwards compatibility with
  // old clients that did not set this. This behavior may be dropped in future releases.
  // (condition: after rerun-sdk 0.34 is out of its support cycle)
  repeated EntryKind entry_kinds = 4;
}

// What type of entry. This has strong implication on which APIs are available for this entry.
enum EntryKind {
  // Always reserve unspecified as default value
  ENTRY_KIND_UNSPECIFIED = 0;

  // Order as TYPE, TYPE_VIEW so things stay consistent as we introduce new types.
  ENTRY_KIND_DATASET = 1;

  // A view over a dataset.
  //
  // Reserved: no server currently creates entries of this kind. Filtering for it is legal and
  // returns no entries.
  ENTRY_KIND_DATASET_VIEW = 2;

  // A table.
  ENTRY_KIND_TABLE = 3;

  // A view over a table.
  //
  // Reserved: no server currently creates entries of this kind. Filtering for it is legal and
  // returns no entries.
  ENTRY_KIND_TABLE_VIEW = 4;

  // A dataset holding the blueprints of another entry.
  ENTRY_KIND_BLUEPRINT_DATASET = 5;

  // A dataset holding the static assets shared by another dataset's segments.
  ENTRY_KIND_ASSET_DATASET = 6;
}

// Minimal info about an Entry for high-level catalog summary
message EntryDetails {
  // The EntryId is immutable
  rerun.common.v1alpha1.EntryId id = 1;

  // The name of this entry.
  optional string name = 2;

  // The kind of entry
  EntryKind entry_kind = 3;

  // When this entry was created.
  google.protobuf.Timestamp created_at = 4;

  // When this entry was last modified. See `TouchDatasetEntry` on the internal Catalog API.
  google.protobuf.Timestamp updated_at = 5;
}

// Updatable fields of an Entry
message EntryDetailsUpdate {
  // The name of this entry.
  optional string name = 2;
}

// The dataset-specific part of a `DatasetEntry`. Updatable with `UpdateDatasetEntry`.
message DatasetDetails {
  // The blueprint dataset associated with this dataset (if any).
  // This association is owned for lifecycle purposes: deleting this dataset also deletes the associated blueprint dataset.
  //
  // Client-owned, unlike [`DatasetDetails::asset_dataset`]: leaving this unset in
  // `UpdateDatasetEntry` clears the reference, and the dataset keeps working without a blueprint.
  optional rerun.common.v1alpha1.EntryId blueprint_dataset = 3;

  // The segment of the blueprint dataset corresponding to the default blueprint (if any).
  optional rerun.common.v1alpha1.SegmentId default_blueprint_segment = 5;

  // The segment of the blueprint dataset corresponding to the default blueprint for this dataset's
  // segment table (if any).
  optional rerun.common.v1alpha1.SegmentId default_segment_table_blueprint_segment = 6;

  // The asset dataset associated with this dataset (if any).
  // This association is owned for lifecycle purposes: deleting this dataset also deletes the associated asset dataset.
  //
  // Server-managed, unlike [`DatasetDetails::blueprint_dataset`], because a recording dataset is
  // never meant to be without an asset dataset. Leaving this unset in `UpdateDatasetEntry` keeps
  // the stored reference, and the server re-attaches or re-creates the asset dataset if that
  // reference is missing or dangling (recordings created before asset datasets existed have
  // none). Set it to move the entry to a different asset dataset. Blueprint and asset datasets
  // are not recordings, so none of this applies to them: there, unsetting clears the field like
  // any other.
  optional rerun.common.v1alpha1.EntryId asset_dataset = 7;

  reserved 4;
  reserved "default_blueprint";
}

// Everything the catalog knows about one dataset.
message DatasetEntry {
  reserved 3;
  reserved "blueprint_dataset";

  // The kind-agnostic part, shared with every other entry kind.
  EntryDetails details = 1;

  // Dataset-specific information, may be update with `UpdateDatasetEntry`
  DatasetDetails dataset_details = 4;

  // Read-only
  rerun.common.v1alpha1.DatasetHandle dataset_handle = 2;
}

// The table-specific part of a `TableEntry`. Updatable with `UpdateTableEntry`.
message TableDetails {
  // Blueprint dataset associated with this table.
  // This association is owned for lifecycle purposes: deleting this table also deletes the associated blueprint dataset.
  //
  // Like recording datasets, tables get an associated blueprint dataset automatically when they are created.
  //
  // Server-managed on `UpdateTableEntry`: leaving it unset keeps the stored association instead of clearing it, and creates
  // the blueprint dataset if the table does not have one yet.
  optional rerun.common.v1alpha1.EntryId blueprint_dataset = 1;

  // Segment of the blueprint dataset corresponding to the default table blueprint.
  optional rerun.common.v1alpha1.SegmentId default_blueprint_segment = 2;
}

// Everything the catalog knows about one table.
message TableEntry {
  // The kind-agnostic part, shared with every other entry kind.
  EntryDetails details = 1;

  // Details specific to the table-provider
  google.protobuf.Any provider_details = 3;

  // Table-specific information, may be updated with `UpdateTableEntry`.
  TableDetails table_details = 4;

  reserved 2;
  reserved "schema";
}

// Which built-in table a `SystemTable` refers to.
enum SystemTableKind {
  // Always reserve unspecified as default value
  SYSTEM_TABLE_KIND_UNSPECIFIED = 0;

  // Not used yet
  SYSTEM_TABLE_KIND_NAMESPACES = 1;

  // All of the entries in the associated namespace
  SYSTEM_TABLE_KIND_ENTRIES = 2;
}

// A built-in table maintained by the server rather than registered by a user.
message SystemTable {
  // Which built-in table this is.
  SystemTableKind kind = 1;
}

// A foreign table stored as a Lance table.
message LanceTable {
  // The URL of the Lance table.
  string table_url = 1;
}

// Optional debug info
message DebugInfo {
  // The amount of memory used by the task or service call in bytes
  optional uint64 memory_used = 1;
}

// `ChunkKey` provides chunk location details in the data store.
//
// Returned by `QueryDataset` (in the `chunk_key` Arrow column) and forwarded
// back to the server on `FetchChunks`. The `location` payload is opaque and
// interpreted per `data_source_kind` (e.g. `RrdChunkLocation` for RRD).
message ChunkKey {
  // Chunk unique identifier
  rerun.common.v1alpha1.Tuid chunk_id = 1;

  // What type of partition is this, rrd, mcap, etc.
  // This information determines how to interpret the `location` payload.
  DataSourceKind data_source_kind = 2;

  // The location of the chunk in the data store. Opaque bytes; readers
  // decode based on `data_source_kind`.
  optional bytes location = 3;

  // ETag of the source object (segment) as observed at registration time.
  //
  // Optional: legacy registrations and stores that do not return an ETag
  // leave this unset.
  optional string etag = 4;

  // Wall-clock registration time of the parent segment (nanoseconds since
  // the Unix epoch), as recorded in the dataset manifest.
  //
  // Diagnostic only: not used as a precondition. Lets a client correlate a
  // decode failure on a stale chunk handle with a subsequent re-registration
  // event without consulting the dataset manifest. Optional: legacy
  // registrations leave this unset.
  optional int64 registration_time_nanos = 5;
}

// RRD-specific decoding of `ChunkKey.location`.
message RrdChunkLocation {
  // Where the chunk is stored (e.g. s3://bucket/file, file:///path/to/file).
  optional string url = 1;

  // Byte offset of the chunk within the data source.
  optional uint64 offset = 2;

  // Chunk length in bytes.
  optional uint64 length = 3;
}

// `RrdManifestKey` points at an encoded `rerun.log_msg.v1alpha1.RrdFooter` payload in the object store.
message RrdManifestKey {
  // The canonical location of the footer payload (e.g. s3://bucket/file).
  RrdChunkLocation location = 1;

  // The segment layer whose manifest is stored in this footer.
  optional string layer = 2;

  // ETag of the source object (the layer's RRD file) as observed at registration time.
  //
  // Clients should pass this as an `If-Match` precondition when fetching, so that a concurrent
  // re-registration results in a clean failure (HTTP 412) instead of decoding garbage from a
  // mismatched byte range.
  //
  // Optional: legacy registrations and stores that do not return an ETag leave this unset.
  optional string etag = 3;

  // Presigned URL the client fetches the manifest's byte range from.
  optional string direct_url = 4;
}
