/* Indexing */

// Reserved (removed): the custom-index / vector-search subsystem was removed.
// The following message and enum names were deleted and must not be reused:
// CreateIndexRequest, CreateIndexResponse, ListIndexesRequest, ListIndexesResponse,
// DeleteIndexesRequest, DeleteIndexesResponse, IndexConfig, IndexColumn, IndexProperties,
// InvertedIndex, VectorIvfPqIndex, VectorDistanceMetric, BTreeIndex, SearchDatasetRequest,
// SearchDatasetResponse, IndexQueryProperties, InvertedIndexQuery, VectorIndexQuery, BTreeIndexQuery.

/* Queries */

// Request for `QueryDataset`.
//
// The dataset is identified by the standard dataset headers (see the `Headers` section at the top of this file).
message QueryDatasetRequest {
  // Client can specify what segments are queried. If left unspecified (empty list),
  // all segments will be queried.
  repeated rerun.common.v1alpha1.SegmentId segment_ids = 11;

  // Will ask the server to generate direct URLs for the requested segments.
  // It is not guaranteed that the server will return all (or any) of them.
  bool generate_direct_urls = 12;

  // Client can specify specific chunk ids to include. If left unspecified (empty list),
  // all chunks that match other query parameters will be included.
  repeated rerun.common.v1alpha1.Tuid chunk_ids = 3;

  // Which entity paths are we interested in? Leave empty, and set `select_all_entity_paths`,
  // in order to query all of them.
  repeated rerun.common.v1alpha1.EntityPath entity_paths = 4;

  // If set, the query will cover all existing entity paths.
  //
  // `entity_paths` must be empty, otherwise an error will be raised.
  //
  // Truth table:
  // ```text
  // select_all_entity_paths | entity_paths   | result
  // ------------------------+----------------+--------
  // false                   | []             | valid query, empty results (no entity paths selected)
  // false                   | ['foo', 'bar'] | valid query, 'foo' & 'bar' selected
  // true                    | []             | valid query, all entity paths selected
  // true                    | ['foo', 'bar'] | invalid query, error
  // ```
  bool select_all_entity_paths = 7;

  // Which components are we interested in?
  //
  // If left unspecified, all existing components are considered of interest.
  //
  // This will perform a basic fuzzy match on the available columns' descriptors.
  // The fuzzy logic is a simple case-sensitive `contains()` query.
  // For example, given a `log_tick__SeriesLines:width` index, all of the following
  // would match: `SeriesLines:width`, `Width`, `SeriesLines`, etc.
  repeated string fuzzy_descriptors = 10;

  // If set, static data will be excluded from the results.
  bool exclude_static_data = 8;

  // If set, temporal data will be excluded from the results.
  bool exclude_temporal_data = 9;

  // Generic parameters that will influence the behavior of the Lance scanner.
  rerun.common.v1alpha1.ScanParameters scan_parameters = 5;

  // The Rerun-native query to run. Leave unset to match on the other filters alone: an unset
  // `query` applies no temporal narrowing.
  Query query = 6;

  reserved 1;
  reserved "dataset_id";
  reserved 2;
  reserved "partition_ids";
}

// One batch of query results, yielded by `QueryDataset`.
message QueryDatasetResponse {
  // One row per matching chunk. These columns are always present, in this order (pinned by
  // [`QueryDatasetDataframe`](crate::cloud::v1alpha1::ext::QueryDatasetDataframe)): `chunk_id`, `chunk_segment_id`, `rerun_segment_layer`,
  // `chunk_key`, `chunk_entity_path`, `chunk_is_static`, `chunk_byte_len`,
  // `chunk_byte_size_uncompressed`, `rerun_layer_direct_url`,
  // `rerun_layer_direct_url_expires_at`.
  //
  // `chunk_key` is the opaque handle to pass to `FetchChunks`. The direct-URL columns are all
  // null unless the server honored `generate_direct_urls`. Additional columns appear on
  // demand: one nullable Int64 `{timeline}:start` column per timeline the query can see, and
  // more per the `columns_always_include_*` flags on `Query` and `scan_parameters.columns`.
  //
  // Every batch of one stream carries the same schema, so clients can concatenate them.
  rerun.common.v1alpha1.DataframePart data = 1;
}

// A Rerun-native query over a dataset's chunks.
message Query {
  // If specified, will perform a latest-at query with the given parameters.
  //
  // You can combine this with a `QueryRange` in order to gather all the relevant chunks for
  // a full-fledged dataframe query (i.e. they get OR'd together).
  QueryLatestAt latest_at = 1;

  // If specified, will perform a range query with the given parameters.
  //
  // You can combine this with a `QueryLatestAt` in order to gather all the relevant chunks for
  // a full-fledged dataframe query (i.e. they get OR'd together).
  QueryRange range = 2;

  // If true, `columns` will contain the entire schema.
  bool columns_always_include_everything = 3;

  // If true, `columns` always includes `byte_offset` and `byte_size`.
  bool columns_always_include_byte_offsets = 5;

  // If true, `columns` always includes `entity_path`.
  bool columns_always_include_entity_paths = 6;

  // If true, `columns` always includes all static component-level indexes.
  bool columns_always_include_static_indexes = 7;

  // If true, `columns` always includes all temporal chunk-level indexes.
  bool columns_always_include_global_indexes = 8;

  // If true, `columns` always includes all component-level indexes.
  bool columns_always_include_component_indexes = 9;

  reserved 4;
  reserved "columns_always_include_chunk_ids";
}

// A chunk-level latest-at query, aka `LatestAtRelevantChunks`.
//
// This has the exact same semantics as the query of the same name on our `ChunkStore`.
//
// Two modes of use (mutually exclusive):
//   1. Global: set `at`. Applied to all segments.
//   2. Per-segment: set `per_segment_values`. Each entry is positionally
//      matched to `QueryDatasetRequest.segment_ids`. `at` and `Query.range`
//      must be unset — the server reconstructs global bounds internally
//      from the per-segment values.
message QueryLatestAt {
  // Which index column should we perform the query on? E.g. `log_time`.
  //
  // Leave this empty to query for static data.
  rerun.common.v1alpha1.IndexColumnSelector index = 1;

  // Global query value — applied to all segments.
  //
  // Omit this field to query for static data only.
  // Mutually exclusive with `per_segment_values`.
  optional int64 at = 2;

  // Per-segment index values, positionally matched to
  // `QueryDatasetRequest.segment_ids`.
  //
  // When non-empty, `at` and `Query.range` must be unset — the server
  // reconstructs global bounds from the values for Lance pre-filtering,
  // then applies a per-segment post-filter for precision.
  //
  // Constraints (server returns `invalid_argument` on violation):
  //   - `segment_ids` must be non-empty.
  //   - `per_segment_values.len()` must equal `segment_ids.len()`.
  //   - `segment_ids` must contain no duplicates.
  //
  // Each entry's values list corresponds to the segment at the same
  // position in `segment_ids`. An empty values list for a segment means
  // no temporal chunks are returned for that segment (only static data).
  repeated IndexValueList per_segment_values = 4;

  reserved 3;
  reserved "fuzzy_descriptors";

  // Reserved for a future `QueryAtMode mode` enum (LATEST_AT vs EXACT
  // semantics). Tracked separately from this PR to keep scope narrow.
  reserved 5;
  reserved "mode";
}

// A list of index values for a single segment.
// Used in `QueryLatestAt.per_segment_values`.
message IndexValueList {
  // The index values, in the units of the queried index column.
  repeated int64 values = 1;
}

// A chunk-level range query, aka `RangeRelevantChunks`.
//
// This has the exact same semantics as the query of the same name on our `ChunkStore`.
message QueryRange {
  // Which index column should we perform the query on? E.g. `log_time`.
  rerun.common.v1alpha1.IndexColumnSelector index = 1;

  // What index range are we looking for?
  rerun.common.v1alpha1.TimeRange index_range = 2;

  reserved 3;
  reserved "fuzzy_descriptors";

  // Reserved for a future `repeated IndexValueList per_segment_values`
  // (symmetric per-segment pushdown for range queries). See RR-4355.
  reserved 4;
  reserved "per_segment_values";
}

// Request for `FetchChunks`.
message FetchChunksRequest {
  // Information about the chunks to fetch, concatenated across parts.
  //
  // These are a subset of the columns of
  // [`QueryDatasetDataframe`](crate::cloud::v1alpha1::ext::QueryDatasetDataframe), which pins
  // their exact types.
  // See [`Self::required_column_names`](crate::cloud::v1alpha1::FetchChunksRequest::required_column_names)
  // for the required column names. Any other column is ignored.
  repeated rerun.common.v1alpha1.DataframePart chunk_infos = 1;
}

// One batch of chunks yielded by `FetchChunks`.
message FetchChunksResponse {
  // Every gRPC response, even within the confines of a stream, involves HTTP2 overhead, which isn't
  // cheap by any means, which is why we're returning a batch of `ArrowMsg` rather than a single one.
  repeated rerun.log_msg.v1alpha1.ArrowMsg chunks = 1;
}

