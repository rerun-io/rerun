[package]
authors.workspace = true
description = "A view that shows the data contained in entities in a table."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_view_dataframe"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_chunk_store/crypto-ring",
  "re_dataframe/crypto-ring",
  "re_dataframe_ui/crypto-ring",
  "re_ui/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_chunk_store/crypto-aws-lc-rs",
  "re_dataframe/crypto-aws-lc-rs",
  "re_dataframe_ui/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

[dependencies]
re_byte_size = { workspace = true, features = ["egui"] }
re_chunk_store.workspace = true
re_dataframe.workspace = true
re_dataframe_ui.workspace = true
re_error.workspace = true
re_format.workspace = true
re_log_types.workspace = true
re_log.workspace = true
re_sorbet.workspace = true
re_tracing.workspace = true
re_types_core.workspace = true
re_sdk_types.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

anyhow.workspace = true
arrow.workspace = true
egui_dnd.workspace = true
egui_table.workspace = true
egui.workspace = true
itertools.workspace = true

[dev-dependencies]
re_chunk_store.workspace = true
re_component_ui.workspace = true
re_test_context.workspace = true
re_test_viewport.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
