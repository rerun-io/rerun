[package]
authors.workspace = true
description = "Views that show entities in a 2D or 3D spatial relationship."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "re_view_spatial"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_chunk_store/crypto-ring",
  "re_data_ui/crypto-ring",
  "re_entity_db/crypto-ring",
  "re_query/crypto-ring",
  "re_tf/crypto-ring",
  "re_ui/crypto-ring",
  "re_view/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_chunk_store/crypto-aws-lc-rs",
  "re_data_ui/crypto-aws-lc-rs",
  "re_entity_db/crypto-aws-lc-rs",
  "re_query/crypto-aws-lc-rs",
  "re_tf/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_view/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

## Enable faster native video decoding with assembly.
## You need to install [nasm](https://github.com/netwide-assembler/nasm) to compile with this feature.
nasm = ["re_video/nasm"]

[dependencies]

re_byte_size = { workspace = true, features = ["ecolor", "egui", "glam", "re_math"] }
re_chunk_store.workspace = true
re_data_ui.workspace = true
re_entity_db.workspace = true
re_error.workspace = true
re_format.workspace = true
re_gamepad.workspace = true
re_int.workspace = true
re_log.workspace = true
re_log_types.workspace = true
re_math = { workspace = true, features = ["serde"] }
re_query.workspace = true
re_renderer = { workspace = true, features = [
  "import-gltf",
  "import-obj",
  "import-ply",
  "import-stl",
  "import-dae",
] }
re_rvl.workspace = true
re_sdk_types = { workspace = true, features = ["ecolor", "glam", "image"] }
re_span.workspace = true
re_tf.workspace = true
re_tracing.workspace = true
re_ui.workspace = true
re_video.workspace = true
re_view.workspace = true
re_viewer_context.workspace = true
re_viewport_blueprint.workspace = true

ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
egui = { workspace = true, features = ["serde"] }
glam.workspace = true
half.workspace = true
hexasphere.workspace = true
image = { workspace = true, features = [
  "png",
] } # For loading images/icons for the gui into textures.
itertools.workspace = true
nohash-hasher.workspace = true
ordered-float.workspace = true
parking_lot.workspace = true
serde.workspace = true
smallvec = { workspace = true, features = ["serde"] }
thiserror.workspace = true
vec1.workspace = true


[dev-dependencies]
re_component_ui.workspace = true
re_test_context.workspace = true
re_test_viewport.workspace = true

half.workspace = true
insta.workspace = true
ndarray.workspace = true
re_mp4.workspace = true
tiff.workspace = true

[lib]
bench = false

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
