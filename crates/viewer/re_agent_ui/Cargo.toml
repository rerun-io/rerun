[package]
authors.workspace = true
description = "Chat UI for driving a coding agent (Claude Code, Codex, …) over the Agent Client Protocol"
edition.workspace = true
homepage.workspace = true
license.workspace = true
include.workspace = true
name = "re_agent_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []

## Hooks for feeding an `AgentSession` without a running agent, used by the snapshot tests.
testing = ["re_agent/testing"]

[dependencies]
re_agent.workspace = true
re_ui.workspace = true

base64.workspace = true
egui.workspace = true
egui_tiles.workspace = true
jiff.workspace = true
pulldown-cmark.workspace = true
serde_json.workspace = true

[dev-dependencies]
re_log = { workspace = true, features = ["setup"] }
re_ui = { workspace = true, features = ["testing"] }

clap.workspace = true
egui_kittest.workspace = true
eframe = { workspace = true, features = ["persistence", "wgpu"] }
egui_inspection.workspace = true

[[example]]
name = "agent_app"
