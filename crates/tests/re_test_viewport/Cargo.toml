[package]
name = "re_test_viewport"
description = "A viewport used for tests"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = [
  "re_test_context/crypto-ring",
  "re_ui/crypto-ring",
  "re_view/crypto-ring",
  "re_viewer_context/crypto-ring",
  "re_viewport_blueprint/crypto-ring",
]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = [
  "re_test_context/crypto-aws-lc-rs",
  "re_ui/crypto-aws-lc-rs",
  "re_view/crypto-aws-lc-rs",
  "re_viewer_context/crypto-aws-lc-rs",
  "re_viewport_blueprint/crypto-aws-lc-rs",
]

[dependencies]
re_log_types.workspace = true
re_test_context.workspace = true
re_sdk_types.workspace = true
re_ui.workspace = true
re_viewer_context.workspace = true
re_view.workspace = true
re_viewport_blueprint.workspace = true

# External dependencies
ahash.workspace = true
egui.workspace = true

[dev-dependencies]
# These context-menu tests live here instead of in `re_context_menu` because
# dev-dependencies are included in the publishable-crate dependency DAG check.
# If `re_context_menu` depended on this crate for tests, it would create the
# cycle `re_context_menu -> re_test_viewport -> re_viewport -> re_context_menu`.
re_context_menu.workspace = true
re_chunk.workspace = true
re_entity_db.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
