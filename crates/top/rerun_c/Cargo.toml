[package]
name = "rerun_c"
authors.workspace = true
description = "Rerun C SDK"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE-APACHE",
  "../../LICENSE-MIT",
  "**/*.c",
  "**/*.h",
  "**/*.rs",
  "Cargo.toml",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[lib]
crate-type = ["staticlib"]
name = "rerun_c"
doctest = false
test = false


[features]
default = ["crypto-ring"]

## Use Ring for native cryptography (the default).
crypto-ring = ["re_crash_handler/crypto-ring", "re_sdk/crypto-ring"]

## Use AWS-LC for native cryptography. Disable default features to avoid Ring.
crypto-aws-lc-rs = ["re_crash_handler/crypto-aws-lc-rs", "re_sdk/crypto-aws-lc-rs"]

[dependencies]
re_arrow_util.workspace = true
re_build_info.workspace = true
re_crash_handler.workspace = true
re_log = { workspace = true, features = ["setup"] }
re_sdk = { workspace = true, features = ["importers", "server"] }
re_video.workspace = true

ahash.workspace = true
arrow = { workspace = true, features = ["ffi"] }
half.workspace = true
infer.workspace = true
itertools.workspace = true
parking_lot.workspace = true

[build-dependencies]
re_build_tools.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
