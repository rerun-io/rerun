[package]
authors.workspace = true
description = "MCP server that lets LLM agents use Rerun."
edition.workspace = true
homepage.workspace = true
license.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE-APACHE",
  "../../LICENSE-MIT",
  "**/*.bin",
  "**/*.rs",
  "Cargo.toml",
  "src/*.md",
]
name = "re_rerun_mcp"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "rerun-mcp"
path = "src/main.rs"
test = false

[dependencies]
egui_inspection.workspace = true
egui_inspection_tools.workspace = true
re_agent_tools.workspace = true
re_analytics.workspace = true
re_async.workspace = true
re_catalog_tools.workspace = true
re_error.workspace = true
re_log = { workspace = true, features = ["setup"] }
re_protos.workspace = true
re_redap_client.workspace = true
re_uri.workspace = true
re_viewer_control_tools.workspace = true

base64.workspace = true
futures.workspace = true
itertools.workspace = true
parking_lot.workspace = true
rmcp.workspace = true
rustls = { workspace = true, features = ["ring"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "macros", "sync"] }
tonic = { workspace = true, features = ["transport"] }
url.workspace = true


[dev-dependencies]
insta.workspace = true

[target.'cfg(rerun_workspace_hack)'.dependencies]
re_workspace_hack.workspace = true
