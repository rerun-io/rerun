# See https://nexte.st/docs/configuration/

[profile.default]
# warn if a test takes longer than 30 seconds and terminate it after 2 minutes
slow-timeout = { period = "30s", terminate-after = 4 }

# CI profile: retry flaky tests once. Set via `--profile ci` in CI scripts.
# Local runs stay on `default` (no retries) so flakes surface.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 1

# Special profile that only runs the inspection-based tests.
# Used for all inspection targets: in-process, native `rerun-cli`, and the web viewer in a browser.
[profile.inspection]
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 1
default-filter = "binary(=inspection)"
