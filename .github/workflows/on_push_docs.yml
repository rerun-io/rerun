name: "Push Docs"

on:
  push:
    branches: [docs-latest]

concurrency:
  group: on-push-docs
  cancel-in-progress: true

permissions:
  contents: "read"
  id-token: "write"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # The latest final release, from PyPI: every release publishes `rerun-sdk` there,
  # while crates.io is skipped by releases with `publish-crates=false`.
  # PyPI's `info.version` ignores pre-releases (alpha, rc).
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Get version
        id: versioning
        run: |
          version=$(curl --fail --silent --show-error https://pypi.org/pypi/rerun-sdk/json | jq -r .info.version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected latest rerun-sdk version on PyPI: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-search-index:
    runs-on: ubuntu-latest-16-cores
    needs: [get-version]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache_key: "build-linux"
          save_cache: false
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.78.0

      - name: Build search index
        run: |
          pixi run search-index build \
            landing \
            --url "https://ms-b22605aed932-7275.fra.meilisearch.io" \
            --master-key "${{ secrets.MEILISEARCH_TOKEN }}" \
            --release-version "${{ needs.get-version.outputs.version }}"

  # The website reads prose from GCS at SSR time, so a `docs-latest`
  # push takes effect via a GCS re-upload + ISR revalidate.
  upload-prose:
    name: Upload prose to GCS
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.78.0

      - id: "auth"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: "Upload markdown docs & examples to GCS"
        env:
          ISR_BYPASS_TOKEN: ${{ secrets.ISR_BYPASS_TOKEN }}
          VERSION_LABEL: ${{ needs.get-version.outputs.version }}
          RERUN_COMMIT: ${{ github.sha }}
        run: |
          pixi run uv run scripts/ci/upload_docs.py upload \
            --version "$VERSION_LABEL" \
            --rerun-commit "$RERUN_COMMIT" \
            --mark-latest \
            --purge-token "$ISR_BYPASS_TOKEN"
