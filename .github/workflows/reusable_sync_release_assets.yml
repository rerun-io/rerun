name: Sync assets with release

on:
  workflow_call:
    inputs:
      CONCURRENCY:
        required: true
        type: string
      RELEASE_VERSION:
        required: true
        type: string
        default: ""
      WAIT_TIME_SECS:
        required: false
        type: number
        default: 0

concurrency:
  group: ${{ inputs.CONCURRENCY }}-sync-assets
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: "write"
  id-token: "write"

jobs:
  sync-assets:
    name: Upload assets from build.rerun.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.71.3

      - id: "auth"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 363.0.0"

      - name: Sync release assets & build.rerun.io
        run: |
          pixi run python ./scripts/ci/sync_release_assets.py \
            --github-release ${{ inputs.RELEASE_VERSION }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --wait ${{ inputs.WAIT_TIME_SECS }} \
            --remove --update
