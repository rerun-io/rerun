  "ffi",
  "ipc",
  "json",
] }
async-stream = "0.3.6"
async-trait = "0.1.91"
axum = "0.8.9"
backtrace = "0.3.76"
base64 = "0.23.0"
bincode = "1.3"
bit-vec = "0.9.1" # 0.10 would duplicate the 0.9 that `wgpu-core` requires. Bump once `wgpu` moves to bit-vec 0.10.
bitflags = { version = "2.13", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
byteorder = "1.5"
bytes = "1.12"
camino = "1.2"
cargo_metadata = "0.23.1"
cargo-run-wasm = "0.4.0"
cfg_aliases = "0.2.2"
chrono = { version = "0.4.45", default-features = false } # Needed for datafusion, see `re_datafusion`'s Cargo.toml
clap = { version = "4.6", features = ["derive"] }
clean-path = "0.2.1"
colored = "2.2" # 3.1 would duplicate the 2.2 that `dify` (via egui_kittest) requires. Bump once `dify` moves to colored 3.
comfy-table = { version = "7.2", default-features = false }
console_error_panic_hook = "0.1.7"
const_format = "0.2.36"
convert_case = "0.11.0"
criterion = "0.8.2"
cros-codecs = "0.0.6"
crossbeam = "0.8.4"
dae-parser = "0.11.0"
datafusion = { version = "54.0", default-features = false, features = [
  # NOTE: we enable the same features everywhere
  # because otherwise we will recompile datafusion all the time based on our current compile target.
  # The features here are the same as in https://github.com/rerun-io/lance/blob/release-9.0.0/Cargo.toml#L131
  # This is very hacky, and I don't like it.
  "crypto_expressions",
  "datetime_expressions",
  "encoding_expressions",
  "nested_expressions",
  "regex_expressions",
  "sql",
  "string_expressions",
  "unicode_expressions",
] }
datafusion-ffi = "54.0"
directories = "6.0"
document-features = "0.2.12"
econtext = "0.2.0" # Prints error contexts on crashes
ehttp = "0.7.1"
enumset = "1.1"
env_filter = { version = "2.0", default-features = false }
ffmpeg-sidecar = { version = "2.5", default-features = false }
fixed = { version = "1.31", default-features = false }
fjadra = "0.2.1"
futures = "0.3.33"
futures-util = "0.3.33"
getrandom = "0.3.4"
getrandom02 = { package = "getrandom", version = "0.2.17" }
gilrs = "0.11.1" # `gilrs-core` 0.6.8 (pulled by 0.11.2) moves to `nix` 0.31, duplicating the `nix` 0.30 that `zbus` requires, so `gilrs-core` is held at 0.6.7 in `Cargo.lock`. Bump once `zbus` moves to `nix` 0.31.
glam = { version = "0.30.10", features = [
  "debug-glam-assert",
  "serde",
] } # pinned to 0.30 by `macaw`; 0.33 would duplicate glam. Bump once macaw releases a glam-0.33 version.
glob = "0.3.4"
gltf = "1.4"
h264-reader = "0.8.0"
half = { version = "2.7", features = ["bytemuck"] }
hdf5-pure = "=0.33.0" # Very young crate (first release 2026-06) — pin exactly, bump deliberately.
headless_chrome = "1.0.22"
hexasphere = "16.0" # Update in tandem with glam
hmac = "0.12.1" # pinned by `jsonwebtoken` (RustCrypto family); bump once jsonwebtoken moves to hmac 0.13/sha2 0.11/signature 3.
http = "1.5"
http-body = "1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indent = "0.1.1"
indexmap = { version = "2.14", features = [
  # indexmap version chosen to align with other dependencies
  "std",
  "serde",
] }
indicatif = "0.18.6" # Progress bar
infer = "0.22.0" # infer MIME type by checking the magic number signature
insta = "1.48"
itertools = "0.15.0"
jiff = { version = "0.2.35", features = ["js"] }
js-sys = "0.3.103"
jsonwebtoken = { version = "10.4", default-features = false }
lance = { version = "9.0", default-features = false } # When you update this, also update the list of features enabled for `datafusion` (~50 lines up)
libc = "0.2.189"
linked-hash-map = { version = "0.5.6", default-features = false }
log = "0.4.33"
lz4_flex = "0.13.1"
macaw = "0.30.0"
mcap = "0.25.0"
memmap2 = "0.9.11"
memory-stats = "1.2"
mimalloc = { version = "=0.1.48", features = [
  # A) we want to use v3 because of https://github.com/rerun-io/rerun/pull/11703
  # B) we need to pin to 0.1.48 because of https://github.com/microsoft/mimalloc/issues/1287
  "v3",
] } # Waiting for fix from microsoft/mimalloc/issues/1287 to land in mimalloc crate
mime_guess2 = "2.3" # infer MIME type by file extension, and map mime to file extension
mint = "0.5.9"
natord = "1.0"
ndarray = "0.16.1" # pinned by `lance-index` (lance family) and `numpy` to 0.16; 0.17 would duplicate.
never = "0.1.0"
nohash-hasher = "0.2.0"
notify = { version = "8.2", features = ["macos_kqueue"] }
# `unicode-segmentation` is off so that match indices are plain `char` indices,
# which is what we index with when highlighting matched characters.
nucleo-matcher = { version = "0.3.1", default-features = false, features = [
  "unicode-casefold",
  "unicode-normalization",
] }
num-derive = "0.4.2" # 0.5 would duplicate the 0.4 that `av-data` (via re_rav1d) requires. Bump once re_rav1d is updated (same blocker as `strum`).
num-traits = "0.2.19"
numpy = "0.28.0"
