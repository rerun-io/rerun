# TODO(#8766): `rerun_js/web-viewer/build-wasm.mjs` is HIGHLY sensitive to changes in `wasm-bindgen`.
#     Whenever updating `wasm-bindgen`, update the exact version constraints in
#     `crates/viewer/re_redap_browser/Cargo.toml` and `crates/viewer/re_viewer/Cargo.toml`, then make
#     sure that notebooks still work:
#         See `rerun_notebook/README.md` for how to run notebooks.
#         Try running a cell which starts a viewer, and then running it again.
#         There should be no errors in the browser console.
#     Keep this workspace dependency non-exact so that published Rust libraries remain compatible
#     with newer `wasm-bindgen` versions when they are not building the web viewer.
#     For details see https://github.com/rerun-io/rerun/issues/8766
wasm-bindgen = "0.2.126" # ⚠️ read above notice before touching this!
