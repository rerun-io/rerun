semi = true
tabWidth = 4
trailingComma = "all"

[[overrides]]
files = ["*.yml", "*.yaml"]
options = { tabWidth = 2 }

[[overrides]]
files = ["*.js", "*.mjs", "*.cjs", "*.ts", "*.d.ts"]
# Match rustfmt's default width, except for snippets embedded on the website.
options = { semi = true, tabWidth = 2, printWidth = 100, quoteProps = "preserve" }

[[overrides]]
files = [
  "docs/snippets/**/*.js",
  "docs/snippets/**/*.mjs",
  "docs/snippets/**/*.cjs",
  "docs/snippets/**/*.ts",
]
options = { printWidth = 80 }

[[overrides]]
files = [".prettierrc", "*.json", "*.css", "*.html"]
options = { tabWidth = 2 }

[[overrides]]
files = ["*.ts"]
options = { parser = "typescript" }
